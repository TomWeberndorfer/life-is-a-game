:root[data-stil="cozy"] .tat-held { border-color: #9DB08A; }
/* Monsterjäger: Pixel-Questbrett mit harter Kante, Handlung in Jägerrot, Gegner violett */
:root[data-stil="monster"] .heldentat { --tat-bg: #F6FBE6; --tat-ink: #1D2B12; --tat-rand: #1D2B12; --tat-akzent: #C0392B; --tat-auf-akzent: #FFFFFF; --tat-akzent-dunkel: #7E241B;
  --tat-wenn: #7B3FA0; --tat-dann: #2B6E27; --tat-feld: #EAF3C8; --tat-linie: #8FA860; --tat-leise: #34471C;
  border-width: 3px; border-radius: 2px; margin: 8px 4px 12px 0; box-shadow: 4px 4px 0 #1D2B12; }
:root[data-stil="monster"] .heldentat .eyebrow.tat-eyebrow { color: #34471C; opacity: 1; }
:root[data-stil="monster"] .tat-medaille, :root[data-stil="monster"] .tat-held { border-radius: 2px; }
:root[data-stil="monster"] .tat-medaille { background: #FFD23F; border-color: #1D2B12; color: #1D2B12; box-shadow: 2px 2px 0 #1D2B12; }
:root[data-stil="monster"] .heldentat .btn.tat-ja { border-radius: 2px; box-shadow: 3px 3px 0 #1D2B12; }
:root[data-stil="monster"] .heldentat .btn.tat-nein, :root[data-stil="monster"] .heldentat .btn.tat-schwer { border-radius: 2px; }
/* Version 45: Porträt-Tipp und XP im Heldenkopf, „Weiter zu …“, Bonus-Umschalter */
.heldenkopf { position: relative; }
.kopf-portraet { position: relative; flex: none; padding: 0; border: 0; background: none; border-radius: 50%; cursor: pointer; }
.kopf-info { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; background: var(--panel); border: 2px solid var(--ac); color: var(--ac); font: italic 700 calc(13px * var(--text-skala, 1))/18px Georgia, serif; text-align: center; box-sizing: border-box; }
.kopf-xp { flex: none; width: 100%; height: 6px; margin-top: 4px; max-width: 180px; }
.kopf-flug { top: 4px; left: 34px; }
.xpflug.schwebend { position: absolute; top: 96px; z-index: 8; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.weiter-zu { min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 6px 14px 6px 6px; border-radius: 28px; border: 2px solid var(--tat-akzent, var(--ac)); background: transparent; color: var(--tat-ink, var(--ink)); text-align: left; cursor: pointer; font: inherit; }
.weiter-zu .spalte { flex: 1; min-width: 0; }
.weiter-zu .klein { color: var(--tat-leise, var(--mute)); }
.weiter-zu .ic { width: 20px; height: 20px; }
.weiter-bild { width: 44px; height: 44px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid var(--tat-akzent, var(--ac)); box-sizing: border-box; }
.tat-alle { margin: 0; font: 600 calc(15px * var(--text-skala, 1))/1.35 var(--fb); }
.bonus-mehr { align-self: flex-start; min-height: 44px; }
/* Bewegung (Version 46). Werte aus js/daten/bewegung.js (--bw-*). Nur Auftritt und Rückmeldung, nie Dauerbewegung. */
.auftritt { animation: bw-auftritt var(--bw-dauer, 380ms) cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--i, 0) * var(--bw-versatz, 40ms)); }
@keyframes bw-auftritt { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.heldentat.auftritt { animation-name: bw-betont; animation-duration: calc(var(--bw-dauer, 380ms) * 1.4); }
@keyframes bw-betont { 0% { opacity: 0; transform: translateY(18px) scale(.96); } 70% { opacity: 1; transform: translateY(0) scale(1.015); } 100% { transform: none; } }
.kopf-bild.auftritt-ring { animation: bw-ring 650ms cubic-bezier(.2,.8,.3,1) both; }
@keyframes bw-ring { 0% { transform: scale(.7); box-shadow: 0 0 0 0 var(--ac); } 55% { transform: scale(1.06); box-shadow: 0 0 0 7px transparent; } 100% { transform: none; box-shadow: 0 0 0 0 transparent; } }
.heldentat .btn { transition: transform .12s ease; }
.heldentat .btn:active { transform: scale(.95); }
.erledigt.neu { animation: bw-pop 420ms cubic-bezier(.2,.9,.3,1.3) both; }
.erledigt.neu .ic path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: bw-haken 420ms 160ms ease-out forwards; }
@keyframes bw-pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
@keyframes bw-haken { to { stroke-dashoffset: 0; } }
.weiter-zu.neu, .tat-alle.neu { animation: bw-auftritt 380ms 520ms cubic-bezier(.2,.8,.3,1) both; }
.segmente i.bricht { animation: bw-bricht 700ms ease-out both; }
@keyframes bw-bricht { 0% { background: var(--gegner); transform: none; } 30% { background: var(--gegner); transform: scale(1.25) rotate(-6deg); } 100% { background: var(--tief); transform: none; } }
.mikro-zeile.neu { animation: bw-auftritt 300ms cubic-bezier(.2,.8,.3,1) both; animation-delay: calc(var(--i, 0) * 50ms); }
.duell-bild { animation: bw-zoom var(--bw-zoom, 20s) ease-in-out var(--bw-zoom-versatz, 0s) infinite alternate; transform-origin: 60% 40%; }
@keyframes bw-zoom { from { transform: scale(1); } to { transform: scale(1.07); } }
/* Boss-Reaktion (Version 68): in der Heldentat unter „Erledigt“. Bewegung: Ablauf „tagesCheck“ in daten/bewegung.js. */
.boss-reaktion-rahmen { position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; }
.boss-reaktion { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r); background: var(--tief); border: 1px dashed var(--edge); }
.boss-reaktion p { margin: 0; font: italic 500 calc(16px * var(--text-skala, 1))/1.4 var(--fi); color: var(--soft); }
.boss-reaktion.art-phase { border-color: var(--gegner); border-style: solid; }
.boss-reaktion.art-phase p { color: var(--gegner); }
.boss-reaktion-siegel { width: 44px; height: 44px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--nacht); color: var(--nacht-ink); border: 2px solid var(--gegner); box-sizing: border-box; font: 800 calc(22px * var(--text-skala, 1)) var(--fh); }
.blase.ohne-bild { border-radius: 16px; }
.boss-reaktion-bild { width: 44px; height: 44px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid var(--gegner); box-sizing: border-box; }
.angebot { border-color: var(--ac); border-style: dashed; }
.opt.belegt { opacity: .55; cursor: not-allowed; box-shadow: none; }
.opt.belegt small, .opt small { display: block; font: italic 500 calc(14px * var(--text-skala, 1)) var(--fi); color: var(--mute); }
.mikro-text { flex: 1; }
.mikro-held { width: 26px; height: 26px; flex: none; border-radius: 50%; object-fit: cover; }
.hell-btn { color: var(--auf-bild); }

/* Untere Leiste und Heldenstadt (Version 15, nur Darstellung) */
.tabs { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border-top: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { min-height: 56px; border: 0; background: none; color: var(--mute); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 700 calc(12px * var(--text-skala, 1)) var(--fh); letter-spacing: .04em; cursor: pointer; }
.tab.an { color: var(--ac); }
.tab.gesperrt { opacity: .5; }
.tab-ic { position: relative; display: inline-flex; }
.tab-ic .tab-schloss { position: absolute; right: -7px; bottom: -3px; width: 13px; height: 13px; padding: 1px; border-radius: 50%; background: var(--panel); stroke-width: 2.6; }
.tab-nm { max-width: 100%; padding: 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ausbau { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.ausbau-img { display: block; width: 100%; aspect-ratio: 461 / 376; object-fit: cover; border-radius: var(--r); border: 2px solid var(--edge); background: var(--tief); }
.ausbau figcaption { text-align: center; color: var(--mute); }
.skyline { display: flex; align-items: flex-end; gap: 2px; height: 96px; padding: 0 4px; border-bottom: 3px solid var(--edge); }
.sky { flex: 1; min-width: 0; display: flex; align-items: flex-end; }
.sky .bezirk-svg { width: 100%; height: auto; }
.sky:nth-child(odd) .bezirk-svg { transform: scale(.85); transform-origin: bottom; }
.bezirk-svg { display: block; fill: var(--ac); color: var(--ac); }
.unentdeckt .bezirk-svg { fill: var(--line); }
.sky .bezirk-img { width: 100%; height: 56px; object-fit: cover; border-radius: 4px 4px 0 0; }
.bezirke { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bezirk { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px 10px; border-radius: var(--r); text-align: center; font-size: calc(13px * var(--text-skala, 1)); line-height: 1.3; }
.bezirk b { font: 700 calc(13px * var(--text-skala, 1)) var(--fh); overflow-wrap: anywhere; }
.bezirk span:last-child { color: var(--mute); font-size: calc(12px * var(--text-skala, 1)); }
/* Stadt als Einstieg zur Heldenkarte (05.11.2026): Bezirke und Bildleiste sind Knöpfe */
.bezirke > li { display: flex; min-width: 0; }
button.bezirk { width: 100%; font: inherit; color: var(--ink); background: none; border: 1px solid transparent; cursor: pointer; }
button.sky { font: inherit; padding: 0; border: 0; background: none; cursor: pointer; }
button.bezirk:active, button.sky:active { transform: translateY(2px); }
.bezirk.entsteht { background: var(--sel); border: 2px solid var(--ac); }
.bezirk.entsteht span:last-child { color: var(--ac); }
.bezirk.unentdeckt { border: 1px dashed var(--edge); background: var(--tief); color: var(--mute); }
.bezirk-bild { width: 100%; height: 52px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; border-radius: 4px; }
.bezirk-bild .bezirk-svg { height: 100%; width: auto; }
.bezirk-bild .bezirk-img { width: 100%; height: 100%; object-fit: cover; }
.unentdeckt .bezirk-img { filter: grayscale(1) blur(1.5px); opacity: .45; }

/* Andeutungen (Version 18) */
.naechster { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: var(--r); border: 1px dashed var(--edge); background: var(--tief); }
.naechster-bild { position: relative; width: 64px; height: 64px; flex: none; border-radius: 8px; overflow: hidden; background: var(--nacht); }
.schatten { filter: brightness(0) opacity(.75); }

/* Weg der Bosskette und Laufmoment (Version 19) */
.weg { position: relative; display: block; height: 92px; margin: 16px 0 2px; }
.weg svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.weg-rest { fill: none; stroke: var(--line); stroke-width: 3; stroke-dasharray: 2 7; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.weg-geschafft { fill: none; stroke: var(--ac); stroke-width: 4; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.station, .weg-held { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; overflow: hidden; }
.station.start { width: 14px; height: 14px; background: var(--edge); }
.station.aktuell { width: 44px; height: 44px; border: 3px solid var(--gegner); background: var(--nacht); }
.station.nebel { width: 34px; height: 34px; border: 2px dashed var(--line); background: radial-gradient(circle, var(--tief) 30%, transparent 75%); }
.station.besiegt, .station.verborgen { width: 32px; height: 32px; border: 2px solid var(--edge); background: var(--nacht); }
/* 30.10.2026: Vergangenheit ruhig (kleiner, blasser), Gegenwart stark, Zukunft geheimnisvoll */
.station.besiegt { width: 28px; height: 28px; opacity: .8; }
.station-haken { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(0,0,0,.35); }
.station-haken .ic { width: 18px; height: 18px; stroke-width: 3; }
/* Karte (30.10.2026): Reise je Held als gewundener Pfad (ansicht/karte.js); Stationen und Heldenfigur wie beim Weg */
.reise { display: flex; flex-direction: column; gap: 10px; }
/* Version 126: Karte als Rechennetz aus der Breite. container-type macht 100cqw = Innenbreite der Karte; --zeile (inline,
   ansicht/karte.js) = Breite × 16/9 ÷ 6, mindestens zeileMinPx. Höchstbreite --karte-max (+ Innenabstand), dann Mitte. */
.karte.reise { container-type: inline-size; width: 100%; max-width: calc(var(--karte-max, 480px) + 32px); margin-inline: auto; box-sizing: border-box; }
/* Hintergrundbild der Karte (Version 122): Bild unten, Schleier in Kartenfarbe darüber, Inhalt obenauf.
   04.11.2026: nie abgeschnitten – volle Breite, eigene Höhe ab oben, unten weich ausgeblendet (Nebel übernimmt). */
.reise.mit-bild, .reise.mit-nebel { position: relative; overflow: hidden; isolation: isolate; }
/* Version 126: Bildfolge nach Schablone. Jedes Bild deckt 6 Zeilen im Rechennetz des Pfads ab (top/height inline),
   Bilder stoßen lückenlos aneinander; das letzte läuft weich in den Nebel aus, ein Ersatzbild liegt unter dichterem Schleier. */
.reise-hintergrund { position: absolute; left: 0; width: 100%; object-fit: cover; z-index: -2; pointer-events: none; display: block; }
.reise-hintergrund.letztes { -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent); mask-image: linear-gradient(to bottom, #000 78%, transparent); }
.reise-hintergrund.ersatz { opacity: .45; }
.reise.mit-bild::before { content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: color-mix(in srgb, var(--card) calc(var(--karte-schleier, .6) * 100%), transparent); }
.reise-pfad { position: relative; margin: 4px 0 6px; }
.reise-pfad svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.reise-orte { list-style: none; margin: 0; padding: 0; }
.reise-text { position: absolute; transform: translateY(-50%); display: flex; flex-direction: column; gap: 2px; font-size: calc(15px * var(--text-skala, 1)); line-height: 1.25; }
.reise-text b { font: 700 calc(14px * var(--text-skala, 1))/1.2 var(--fh); overflow-wrap: anywhere; }
.reise-text .klein { font-size: calc(13px * var(--text-skala, 1)); }
.reise-text.links { left: var(--text-rand, 36%); right: 0; text-align: left; }
.reise-text.rechts { left: 0; right: var(--text-rand, 36%); text-align: right; }
.reise-ort.nebel .reise-text, .reise-ort.verborgen .reise-text { color: var(--mute); font-style: italic; }
.reise-ort.aktuell .reise-text b { color: var(--gegner); }
.reise-pfad .station.start { width: 16px; height: 16px; }
.reise-pfad .station.besiegt { width: 36px; height: 36px; opacity: .85; }
.reise-pfad .station.aktuell { width: 48px; height: 48px; }
.reise-pfad .station.verborgen { width: 36px; height: 36px; }
.reise-pfad .station.nebel { width: 38px; height: 38px; }
/* Nebel-Zone (04.11.2026): der Weg läuft verblassend hinein, Schwaden ziehen langsam (still bei „Bewegung reduzieren“),
   unten ein ruhiger Abschluss in der Kartenfarbe. Reicht bis an den Kartenrand (Rand = Innenabstand der .karte). */
.reise-nebel { position: relative; height: var(--nebel-hoehe, 100vh); margin: -16px -16px -14px; overflow: hidden; pointer-events: none; }
.reise-nebel::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 0%, color-mix(in srgb, var(--card) 55%, transparent) 35%, var(--card) 78%); }
.nebel-weg { position: absolute; top: 0; bottom: 0; left: 16px; right: 16px; width: calc(100% - 32px); height: 100%; overflow: visible; }
.nebel-weg path { fill: none; stroke: url(#nebel-verlauf); stroke-width: 3; stroke-dasharray: 2 7; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.nebel-schwade { position: absolute; left: -30%; right: -30%; height: 55%; border-radius: 50%; z-index: 1; background: radial-gradient(ellipse at 30% 50%, color-mix(in srgb, var(--tief) 70%, transparent) 0%, transparent 60%), radial-gradient(ellipse at 72% 45%, color-mix(in srgb, var(--card) 85%, transparent) 0%, transparent 55%); filter: blur(6px); animation: bw-nebel var(--bw-nebel, 40s) ease-in-out var(--bw-zoom-versatz, 0s) infinite alternate; }
.nebel-schwade.a { top: 6%; }
.nebel-schwade.b { top: 30%; animation-duration: calc(var(--bw-nebel, 40s) * 1.6); animation-direction: alternate-reverse; opacity: .8; }
@keyframes bw-nebel { from { transform: translateX(-9%); } to { transform: translateX(9%); } }
.nebel-text { position: absolute; z-index: 2; top: 42%; left: 0; right: 0; margin: 0; padding: 0 24px; text-align: center; transform: translateY(-50%); font: italic 600 calc(16px * var(--text-skala, 1))/1.3 var(--fh); color: var(--mute); }
/* Karte überarbeitet (30.10.2026): besiegte Orte antippbar → Rückschau; Knopf „Karte öffnen“ unter dem Weg */
.ort-knopf { cursor: pointer; font: inherit; color: inherit; }
button.station.ort-knopf { padding: 0; }
button.station.ort-knopf:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
button.reise-text.ort-knopf { background: none; border: 0; padding: 4px 0; min-height: 44px; justify-content: center; }
button.reise-text.links.ort-knopf { align-items: flex-start; }
button.reise-text.rechts.ort-knopf { align-items: flex-end; }
.reise-ort.besiegt .reise-text b { text-decoration: underline dotted; text-underline-offset: 3px; }
/* Weg antippbar (31.10.2026): Weg + Statuszeile als ein Knopf zur Karte, Karten-Symbol am Zeilenende */
.weg-bild { display: block; }
.weg-tipp { display: flex; flex-direction: column; align-items: stretch; width: 100%; padding: 0 0 4px; margin: 0; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.weg-tipp:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
/* Weg als Streifen (Version 135): eingeklappt eine Zeile, aufgeklappt wischbare Reihe großer Bilder */
.weg-streifen { display: flex; align-items: center; gap: 10px; width: 100%; margin: 4px 0 0; padding: 8px 2px 2px; border: 0; border-top: 1px dashed var(--line); border-radius: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.weg-streifen:focus-visible, .ws-reihe:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
.ws-boss { position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 2px solid var(--gegner); background: var(--nacht); }
.ws-boss img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ws-mitte { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ws-zeile { line-height: 1.25; }
.ws-balken { display: block; height: 6px; border-radius: 99px; background: var(--tief); border: 1px solid var(--line); overflow: hidden; }
.ws-balken i { display: block; height: 100%; background: var(--gut); border-radius: 99px; }
.ws-pfeil { flex: none; width: 22px; height: 22px; color: var(--soft); transition: transform .25s; }
.weg-streifen[aria-expanded="true"] .ws-pfeil { transform: rotate(180deg); }
/* Version 174: eingeklappte Zeile als Kette (Punkte + „Kapitel n von m“), flach: kein Gegnerbild, kein Balken. Der Tippbereich
   ist unsichtbar größer als die Zeile (::after), damit sie klein aussieht und trotzdem gut zu treffen ist. */
.weg-streifen.kette { position: relative; min-height: 26px; margin: 0 0 -6px; padding: 6px 2px 0; }
.weg-streifen.kette::after { content: ''; position: absolute; inset: -4px 0 -10px; }
.ws-kette { display: flex; align-items: center; gap: 5px; flex: none; }
.ws-kette i { display: block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--edge); background: var(--tief); }
.ws-kette i.besiegt { background: var(--gut); border-color: var(--gut); }
.ws-kette i.aktuell { width: 14px; height: 14px; background: var(--gegner); border-color: var(--gegner); box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--gegner); }
.ws-kette i.kommend { background: transparent; opacity: .55; }
.ws-text { flex: 1; min-width: 0; line-height: 1.25; color: var(--soft); }
.ws-offen { display: flex; flex-direction: column; gap: 4px; }
.ws-reihe { display: flex; gap: 8px; margin: 0; padding: 4px 2px 8px; list-style: none; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.ws-reihe::-webkit-scrollbar { display: none; }
.ws-kachel { flex: none; width: 104px; scroll-snap-align: center; display: flex; flex-direction: column; gap: 4px; }
.ws-bild { position: relative; display: flex; align-items: center; justify-content: center; width: 104px; height: 104px; border-radius: var(--r); overflow: hidden; background: var(--nacht); border: 2px solid var(--edge); }
.ws-bild img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ws-kachel.aktuell .ws-bild { border: 3px solid var(--gegner); }
.ws-kachel.besiegt .ws-bild { opacity: .85; }
.ws-kachel.nebel .ws-bild { border: 2px dashed var(--line); background: linear-gradient(180deg, var(--tief), var(--card)); text-align: center; padding: 6px; }
.ws-kachel .station-haken .ic { width: 34px; height: 34px; }
.ws-held { position: absolute; z-index: 1; left: 5px; bottom: 5px; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 2px solid var(--card); box-shadow: 0 0 0 2px var(--ac); }
.ws-kachel b { font: 700 calc(13px * var(--text-skala, 1))/1.2 var(--fh); overflow-wrap: anywhere; }
.ws-kachel .klein { font-size: calc(13px * var(--text-skala, 1)); line-height: 1.25; }
.ws-fuss { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.ws-karte { display: inline-flex; align-items: center; gap: 4px; }
@media (prefers-reduced-motion: reduce) { .ws-pfeil { transition: none; } }
.weg-zeile { display: flex; align-items: center; gap: 8px; }
.weg-zeile > span { flex: 1; min-width: 0; }
.weg-karte-ic { flex: none; width: 18px; height: 18px; color: var(--mute); }
.rs-runde { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 8px; }
.rs-runde > h3 { margin: 0; font: 700 calc(17px * var(--text-skala, 1))/1.3 var(--fh); }
.rs-runde details.teil p { font-size: calc(17px * var(--text-skala, 1)); }
.weg-held { width: 32px; height: 32px; border: 3px solid var(--gut); background: var(--panel); z-index: 2; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: left .6s ease, top .6s ease; }
/* Heldenfigur schwebt über dem Pfad; der Punkt markiert die Stelle auf dem Weg */
.weg-held-fuss { position: absolute; transform: translate(-50%, -50%); width: 10px; height: 10px; border-radius: 50%; background: var(--gut); border: 2px solid var(--panel); z-index: 2; transition: left .6s ease, top .6s ease; }
.lauf-bahn { position: relative; width: 100%; height: 96px; border-bottom: 3px dashed var(--edge); }
.lauf-station { position: absolute; bottom: 10px; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; border: 2px solid var(--edge); background: var(--nacht); }
.lauf-station.links { left: 4%; } .lauf-station.rechts { right: 4%; }
.lauf-held { position: absolute; bottom: 12px; left: 22%; width: 52px; height: 52px; border-radius: 50%; overflow: hidden; border: 3px solid var(--gut); background: var(--panel); animation: laufen 2.2s ease-in-out forwards; }
@keyframes laufen { 0% { left: 22%; } 70% { transform: translateY(-6px); } 100% { left: 62%; transform: none; } }

/* Entwicklung (Version 21) */
.leben { display: flex; align-items: center; gap: 8px; margin: 0; font-size: calc(15px * var(--text-skala, 1)); color: var(--soft); }
.leben .ic { width: 18px; height: 18px; color: var(--gut); stroke-width: 3; }
.leben b { color: var(--ink); }
.verlauf-runden { position: relative; display: flex; align-items: flex-end; gap: 6px; height: 96px; padding-top: 8px; }
.runde { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; font-size: calc(12px * var(--text-skala, 1)); }
.runde i { display: block; width: 100%; max-width: 34px; min-height: 3px; border-radius: 4px 4px 0 0; background: var(--line); }
.runde.sieg i { background: var(--gut); }
.runde b { font: 700 calc(13px * var(--text-skala, 1)) var(--fh); }
.runde small { color: var(--mute); }
/* Charakterbogen (Etappe 3, Teil E, 02.11.2026): Heldenblatt als Bogen. Gold = Sieg, schraffiert = laufende Runde,
   beendete Runden ohne Sieg gedämpft (nie rot). Gold als Token, je Stil überschreibbar. */
:root { --gold: #C8952B; --gold-dunkel: #8A6416; --auf-gold: #24190A; }
:root[data-stil="scifi"] { --gold: #F2C14E; --gold-dunkel: #B88A1E; --auf-gold: #04121C; }
.bogen { display: flex; flex-direction: column; gap: 12px; padding: 12px; border: 1px solid var(--edge); border-radius: var(--r); background: var(--tief); box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 4px var(--line); }
.bogen-abschnitt { display: flex; flex-direction: column; gap: 8px; }
.bogen-abschnitt + .bogen-abschnitt { border-top: 1px dashed var(--line); padding-top: 12px; }
.bogen-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.bogen .kacheln { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.bogen .kachel { padding: 8px 6px; }
.bogen .kachel .klein { font-size: calc(12px * var(--text-skala, 1)); hyphens: auto; overflow-wrap: break-word; }
.bogen-runden { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.bogen-runde { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.bogen-runde .bogen-feld { position: relative; width: 100%; height: 44px; border-radius: 6px; overflow: hidden; background: var(--card); border: 1px solid var(--line); display: flex; align-items: flex-end; justify-content: center; }
.bogen-runde .bogen-feld i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--line); opacity: .55; }
.bogen-runde .bogen-feld b { position: relative; margin-bottom: 4px; font: 700 calc(13px * var(--text-skala, 1)) var(--fh); color: var(--soft); }
.bogen-runde small { font-size: calc(11px * var(--text-skala, 1)); color: var(--mute); }
.bogen-runde.sieg .bogen-feld { background: var(--gold); border-color: var(--gold-dunkel); box-shadow: 0 2px 0 var(--gold-dunkel); }
.bogen-runde.sieg .bogen-feld i { display: none; }
.bogen-runde.sieg .bogen-feld b { color: var(--auf-gold); }
.bogen-runde.laufend .bogen-feld { border: 2px solid var(--ac); background: repeating-linear-gradient(135deg, var(--card) 0 5px, var(--sel) 5px 10px); }
.bogen-runde.laufend .bogen-feld i { background: var(--ac); opacity: .35; }
.bogen-runde.laufend .bogen-feld b { color: var(--ink); }
.bogen-runde.laufend small { color: var(--ac); font-weight: 700; }
.bogen-faehigkeit { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px; text-align: left; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); color: var(--ink); font: inherit; cursor: pointer; }
.bogen-faehigkeit > .ic { flex: none; color: var(--mute); }
.bogen-faehigkeit .spalte { flex: 1; min-width: 0; gap: 4px; }
.bogen-faehigkeit .nm { font: 700 calc(16px * var(--text-skala, 1)) var(--fh); }
.bogen-regel { font-size: calc(14px * var(--text-skala, 1)); line-height: 1.4; color: var(--soft); }
.bogen-regel b { font: 700 calc(11px * var(--text-skala, 1)) var(--fh); letter-spacing: .06em; color: var(--ac); }
.bogen-regel b.dann { color: var(--gut-text); }
.bogen-mz { display: flex; flex-direction: column; gap: 6px; }
.bogen-mz-kopf { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.bogen-mz-kopf .nm { font-weight: 700; }
.mz-skala { position: relative; display: block; height: 10px; margin: 4px 7px; border-radius: 5px; background: var(--card); border: 1px solid var(--line); }
.mz-skala i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--gut); }
.mz-marke { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--card); border: 3px solid var(--gut); box-sizing: border-box; }
.bogen-mz.erreicht .mz-skala i { background: var(--gold); }
.bogen-mz.erreicht .mz-marke { border-color: var(--gold-dunkel); background: var(--gold); }
.mz-enden { display: flex; justify-content: space-between; gap: 6px; }
.mz-enden .mz-stand { font-weight: 700; color: var(--ink); text-align: center; }
.mz-enden span:last-child { text-align: right; }
:root[data-stil="strasse"] .bogen, :root[data-stil="monster"] .bogen, :root[data-stil="strasse"] .bogen-runde .bogen-feld, :root[data-stil="monster"] .bogen-runde .bogen-feld { border-radius: 2px; }
:root[data-stil="scifi"] .bogen-runde.sieg .bogen-feld { box-shadow: 0 0 10px rgba(242,193,78,.45); }

/* Crew-Botschaft klein (Version 22) */
.botschaft-klein { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px 4px 4px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); color: var(--mute); font: italic 500 calc(14px * var(--text-skala, 1)) var(--fi); cursor: pointer; align-self: flex-start; }
.rund-klein { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
.botschaft-ok { display: block; margin-left: auto; min-height: 32px; font-size: calc(14px * var(--text-skala, 1)); font-style: normal; }

/* Sieg mit Stufe, Karte „Neue Welten“ (Version 42) */
.sieg-stufe { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0; color: var(--ac) !important; }
.sieg-stufe .ic { width: 20px; height: 20px; }
.sieg-stern { display: inline-flex; }
/* Sieg-Einblendung (Version 68): Ablauf „sieg“ in daten/bewegung.js; hier nur der Endzustand (grau). */
.feier-bild.erloschen { filter: grayscale(.7) brightness(.8); }
/* Kapitelsieg (Version 119, Etappe 4 „Spielgefühl“): Vollbild mit Schleier statt Karte, alles aus Stil-Tokens.
   Der Stempel liegt schon auf dem Bild (in der Arena aufgeschlagen). Prunk erlaubt (Höhepunkt, kein ruhiger Ort). */
.feier.kapitelsieg { background: radial-gradient(ellipse at 50% 30%, rgba(var(--schleier),.94), rgb(var(--schleier))); overflow-y: auto; }
.kapitelsieg .sieg-karte { max-width: 360px; margin: auto; background: none; border: 0; box-shadow: none; padding: 20px 0 84px; gap: 14px; color: var(--auf-bild); }
.kapitelsieg .sieg-karte h2 { color: var(--glanz); font-size: calc(26px * var(--text-skala, 1)); letter-spacing: .02em; }
.kapitelsieg .sieg-karte p { color: rgba(var(--auf-bild-rgb),.8); max-width: 32ch; }
.kapitelsieg .sieg-karte .ks-unter { margin-top: -8px; color: var(--auf-bild); font: 700 calc(17px * var(--text-skala, 1))/1.3 var(--fh); }
/* Version 120: Bild nimmt die Höhe, die nach Text, Knopf und Platz für die Rückgängig-Leiste übrig bleibt (rund 520 px),
   mindestens 120 px, höchstens 300 px, nie breiter als 78 % der Breite. Stempel wächst mit (--ks-groesse). */
.ks-bild { --ks-groesse: clamp(120px, min(100vh - 520px, 78vw), 300px); position: relative; width: var(--ks-groesse); height: var(--ks-groesse); flex: none; }
.kapitelsieg .ks-rund { position: relative; display: block; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 3px solid var(--glanz); box-shadow: 0 0 0 1px var(--prunk-kante), 0 0 30px rgba(var(--glanz-rgb),.45); }
.ks-rund > * { display: block; width: 100%; height: 100%; object-fit: cover; }
.ks-bild.erloschen .ks-rund > * { filter: grayscale(.85) brightness(.7); }
/* Stempel darf über den Kreis hinausragen (lange Stilwörter wie „Vorübergezogen!“ bleiben eine Zeile) */
.besiegt-stempel.ks-stempel { top: 50%; left: -60px; right: -60px; transform: translateY(-50%) rotate(-10deg); }
.besiegt-stempel.ks-stempel b { max-width: none; white-space: nowrap; overflow-wrap: normal; padding: .15em .6em; font-size: max(calc(14px * var(--text-skala, 1)), calc(var(--ks-groesse) * .105)); border-width: max(3px, calc(var(--ks-groesse) * .014)); }
.ks-beute { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border: 1px solid rgba(var(--glanz-rgb),.45); border-radius: var(--r); background: rgba(var(--auf-bild-rgb),.08); color: var(--auf-bild); font-size: calc(15px * var(--text-skala, 1)); line-height: 1.3; text-align: left; }
.kapitelsieg .ks-beute { max-width: 320px; }
.kapitelsieg .ks-orden { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--r-siegel); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--glanz) 45%, #fff), var(--glanz) 60%, color-mix(in srgb, var(--glanz) 70%, #000)); color: var(--auf-glanz); font: 800 calc(17px * var(--text-skala, 1)) var(--fh); box-shadow: 0 0 0 2px var(--prunk-kante); }
.kapitelsieg .cta { width: 100%; }
.kapitelsieg .cta:not(:disabled):not(:active) { box-shadow: 0 3px 0 var(--ac-dunkel), 0 0 0 1px var(--prunk-kante), inset 0 1px 0 rgba(255,255,255,.28); }
.welten-karte { flex-direction: row; align-items: center; gap: 12px; border-style: dashed; border-color: var(--ac); }

/* Logbuch (Version 41): ruhige Zeitleiste, nur Tage mit Einträgen, „nicht gebraucht“ neutral */
.lb-seit { margin-top: 4px; }
.lb-filter { display: flex; flex-wrap: wrap; gap: 8px; }
.lb-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 14px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font: 700 calc(14px * var(--text-skala, 1)) var(--fh); cursor: pointer; }
.lb-chip .rund-klein { width: 24px; height: 24px; margin-left: -8px; }
.lb-chip.an { background: var(--ac); border-color: var(--ac); color: var(--auf-ac); }
/* Version 166: Stern „Das will ich mir merken“ und Beweisbuch (ruhig, kein Rot) */
.lb-stern { min-height: 40px; min-width: 40px; opacity: .55; }
.lb-stern.an { opacity: 1; color: var(--ac); }
.beweis-text { line-height: 1.5; overflow-wrap: anywhere; }
.lb-tag { display: flex; flex-direction: column; gap: 6px; }
.lb-tag-kopf { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 0; font: 700 calc(13px * var(--text-skala, 1)) var(--fh); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.lb-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lb-eintrag { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); }
.lb-ic { width: 34px; height: 34px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1.5px solid var(--line); color: var(--ac); }
.lb-ic .ic { width: 18px; height: 18px; }
.lb-eintrag.art-anwendung .lb-ic, .lb-eintrag.art-mikro .lb-ic { color: var(--gut-text); border-color: var(--gut); }
.lb-eintrag.lb-g-meilensteine { border-color: var(--edge); }
.lb-eintrag.art-sieg .lb-ic { background: var(--gut); border-color: var(--gut); color: var(--auf-gut); }
.lb-eintrag.art-nicht .lb-ic { color: var(--mute); }
/* Eigene Einträge (Version 75): schwerer Tag ruhig, nie Rot */
.lb-eintrag.art-schwer .lb-ic { color: var(--mute); }
.lb-notiz { white-space: pre-line; font: italic 500 calc(14px * var(--text-skala, 1))/1.4 var(--fi); color: var(--soft); }
.eintrag-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; }
.eintrag-link { font-size: calc(15px * var(--text-skala, 1)); color: var(--mute); }
/* Version 141: nach dem Siegel „War schwer“ – Blick nach vorn und der Weg zu „Getroffen“ */
.eintrag-comeback { margin: 0; color: var(--gut-text); font-style: italic; }
.eintrag-link.eintrag-doch { color: var(--ink); align-self: flex-start; }
.eintrag-link .ic { width: 18px; height: 18px; }
/* Notfallkarte (Version 75): ruhig, ohne Rot */
.notfall-link { font-size: calc(15px * var(--text-skala, 1)); color: var(--ac); }
/* Nachtragen (Version 79): leise, ohne Rot */
.nachtrag-zeile { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.nachtrag-hinweis { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0 14px; }
.nachtrag-link { font-size: calc(15px * var(--text-skala, 1)); color: var(--tat-leise, var(--mute)); align-self: center; }
.nachtrag-link .ic { width: 18px; height: 18px; } /* Version 89: gleich groß wie die anderen Nebenaktionen */
.nachtrag-weg { font-size: calc(14px * var(--text-skala, 1)); color: var(--tat-leise, var(--mute)); }
.nachtrag-tage { justify-content: center; }
/* Morgenprobe (Version 81): leise Zeile, aufgeklappt eine ruhige Box im Feld-Stil der Heldentat */
.probe { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.probe-link { color: var(--tat-leise, var(--mute)); }
.probe-box { align-self: stretch; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: var(--r); background: var(--tat-feld, var(--panel)); border: 1px dashed var(--tat-linie, var(--edge)); font: 500 calc(15px * var(--text-skala, 1))/1.4 var(--fb); }
.probe-box p { margin: 0; }
.probe-plan { font-style: italic; color: var(--tat-ink, var(--ink)); }
.probe-box .link { align-self: flex-end; font-size: calc(14px * var(--text-skala, 1)); color: var(--tat-leise, var(--mute)); }
/* Morgenprobe ausführlich (Version 81): ruhige Liste, gewählter Merker in der Akzentfarbe, nie Rot */
.probe-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.probe-held { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: var(--r); background: var(--tief); border: 1px solid var(--line); }
.probe-held.an { border-color: var(--ac); }
.probe-kopf { display: flex; align-items: center; gap: 10px; }
.probe-wd { margin: 0; font: 500 calc(15px * var(--text-skala, 1))/1.4 var(--fb); color: var(--ink); }
.probe-wd b { font: 800 calc(11px * var(--text-skala, 1)) var(--fh); letter-spacing: .12em; color: var(--mute); }
.probe-muster { font-style: italic; }
.probe-merker { align-self: flex-start; gap: 6px; }
.probe-merker .ic { width: 18px; height: 18px; }
/* Ruhetag (Version 90, 31.10.2026): Tageswahl als Chips, Helden als ruhige Liste, nie Rot */
.ruhetag-tage { flex-wrap: wrap; }
.ruhetag-tage .opt { flex: 1 0 84px; gap: 4px; }
.ruhetag-tage small { font: 500 calc(12px * var(--text-skala, 1)) var(--fb); color: var(--mute); }
.ruhetag-helden, .ruhetag-liste { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ruhetag-held { min-height: 52px; font-size: calc(16px * var(--text-skala, 1)); }
.ruhetag-held:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.ruhetag-held .ic { margin-left: auto; color: var(--ac); }
.ruhetag-liste li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--r); background: var(--tief); border: 1px solid var(--line); font-size: calc(15px * var(--text-skala, 1)); }
.ruhetag-link .ic { width: 18px; height: 18px; }
/* Plan fürs nächste Mal (Version 81) */
.eintrag-plan textarea { min-height: 0; }
.lb-plan { font-style: normal; }
.nachtrag-tage .opt { gap: 6px; }
.nachtrag-tage .opt .ic { width: 16px; height: 16px; color: var(--gut-text); }
.nachtrag-tage small { font: 500 calc(12px * var(--text-skala, 1)) var(--fb); color: var(--mute); }
.heldentat .btn.gewaehlt { outline: 3px solid var(--tat-akzent, var(--ac)); outline-offset: 2px; }

.ch-marke::before, .ch-marke::after { content: ""; flex: 1; max-width: 64px; border-top: 1px dashed var(--mute); opacity: .6; }
.ch-marke .ic { width: 16px; height: 16px; flex: none; }

/* ---------- Stil-Kulisse und Arena (Version 84, Startseite als Kampfbühne, Entscheidungen Abschnitt 18) ----------
   Kulisse = Grund der Startseite, Rahmen der Karten und untere Leiste je Stil; Arena = Licht und Funken über dem Gegnerbild.
   Nur Variablen je Stil, die Regeln darunter gelten für alle. Fehlt einem Stil eine Variable, bleibt das bisherige Aussehen.
   --k-grund        Hintergrund der Startseite          --k-ink, --k-mute   Schrift direkt auf der Kulisse (außerhalb von Karten)
   --k-rand         Rahmen der Karten                    --k-schatten        Schatten/Leuchten der Karten
   --k-ecken        Zierde in den Kartenecken (Bilderliste), dazu --k-ecken-lage und --k-ecken-groesse (gleiche Reihenfolge)
   --k-tabs-bg, --k-tabs-rand, --k-tabs-schatten, --k-tab-ink, --k-tab-an, --k-tab-schein   untere Leiste
   --arena-a, --arena-b   Lichtschein links unten / rechts      --arena-funke, --arena-schein   Funken */
:root, :root[data-stil="fantasy"] {
  --k-grund: radial-gradient(ellipse at 50% 0%, rgba(255,190,110,.10), transparent 60%), repeating-linear-gradient(90deg, rgba(0,0,0,.20) 0 2px, transparent 2px 11px), repeating-linear-gradient(90deg, rgba(255,210,150,.05) 0 1px, transparent 1px 27px), linear-gradient(180deg, #3B2515, #21130A);
  --k-ink: #E8D9B5; --k-mute: #C9B27C;
  --k-rand: 2px solid #B8862F; --k-schatten: inset 0 0 0 1px #F0D58A, inset 0 0 0 4px var(--card), inset 0 0 0 5px rgba(184,134,47,.55), 0 0 0 1px #3A220E, 0 6px 14px rgba(0,0,0,.5);
  --k-niete: radial-gradient(circle, #F6DE96 0 1.5px, #B8862F 2px 3.2px, #5E3A12 3.6px, transparent 4.2px);
  --k-ecken: var(--k-niete), var(--k-niete), var(--k-niete), var(--k-niete); --k-ecken-lage: left 3px top 3px, right 3px top 3px, left 3px bottom 3px, right 3px bottom 3px; --k-ecken-groesse: 10px 10px;
  --k-tabs-bg: linear-gradient(180deg, #3A2414, #1E1108); --k-tabs-rand: 2px solid #B8862F; --k-tabs-schatten: inset 0 1px 0 #F0D58A;
  --k-tab-ink: #C9B27C; --k-tab-an: #F0D58A; --k-tab-schein: drop-shadow(0 0 5px rgba(240,200,110,.55));
  --arena-a: rgba(255,150,60,.35); --arena-b: rgba(255,120,40,.2); --arena-funke: #FFC266; --arena-schein: rgba(255,150,50,.75);
  /* Namensschild in der Arena (Version 161): Tafel um Name und Kraftsegmente. Fantasy = Holztafel, zugleich Rückfall für alle Stile
     (wie --k-*). Jeder Stilblock setzt seine eigene Form. --schild-unter/-kraft: none = Beiname und Kraftzeile entfallen;
     „Extra“, „ab morgen“ und der Siegtag-Satz bleiben sichtbar. Voll gefärbte Segmente: --schild-seg-voll (Rückfall Gegnerfarbe). */
  --schild-bg: repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 2px, transparent 2px 11px), rgba(30,17,8,.74);
  --schild-rand: 2px solid #B8862F; --schild-radius: 4px; --schild-pad: 5px 11px 6px; --schild-pad-held: 6px 10px 7px; --schild-gap: 3px;
  --schild-schatten: inset 0 0 0 1px rgba(240,213,138,.55), 0 4px 12px rgba(0,0,0,.55);
  --schild-nieten: var(--k-niete), var(--k-niete), var(--k-niete), var(--k-niete);
  --schild-nieten-lage: left 2px top 2px, right 2px top 2px, left 2px bottom 2px, right 2px bottom 2px; --schild-nieten-groesse: 9px 9px;
  --schild-ink: #FBF3DE; --schild-text-schatten: none; --schild-unter: none; --schild-kraft: none;
  --schild-name-gr: 20px; --schild-name-held: 17px; --schild-name-abstand: normal; --schild-name-versal: none;
  --schild-seg-hoch: 8px; --schild-seg-radius: 2px; --schild-seg-leer: rgba(255,255,255,.22); --schild-seg-rand: rgba(255,255,255,.8); --schild-seg-voll: var(--gegner);
  --arena-plateau: linear-gradient(to top, rgba(var(--schleier),.5) 0%, rgba(var(--schleier),0) 46%);
}

/* Schrift direkt auf der Kulisse (z. B. Seitentitel) nimmt --k-ink/--k-mute; in Tafeln gilt wieder die Schrift des Stils.
   Die Stilfarben werden dazu auf .screen.kulisse als --tafel-* gemerkt, bevor .inhalt --ink/--soft/--mute umstellt.
   Seit 31.10.2026 (Schritt Kopfleiste und Neuigkeiten) auf allen Seiten aus daten/stile.js KULISSE_SEITEN (Klasse von app.js). */
.screen.kulisse { background: var(--k-grund, none); --tafel-ink: var(--ink); --tafel-soft: var(--soft); --tafel-mute: var(--mute); }
.screen.kulisse > .start-kopf, .screen.kulisse > .inhalt, .screen.kulisse > .start-fuss { --ink: var(--k-ink); --soft: var(--k-mute); --mute: var(--k-mute); color: var(--ink); }
.screen.kulisse :is(.karte, .heldentat, .blase, .botschaft-klein, .hinweis, .klein-knopf, .einst-btn, .schnellweg, .wechsel-knopf, .lb-eintrag, .lb-filter-feld, .lb-chip, .ch-umschalter, .ch-tagesnotiz, .lb-suche-feld, .kachel, .chip, .opt, .bezirk) { --ink: var(--tafel-ink); --soft: var(--tafel-soft); --mute: var(--tafel-mute); color: var(--ink); }
/* :where() hält die Regeln schwach: Karten mit eigenem Rahmen oder Grund (z. B. .karte.aufgabe) behalten ihn */
/* Die Heldentat behält ihren eigenen Rahmen (Handlungskarte, wird in Schritt „Kampfbühne“ Teil der Bühne). */
:where(.screen.kulisse) .karte:not(.heldentat) { border: var(--k-rand, 2px solid var(--edge)); box-shadow: var(--k-schatten, 0 3px 0 var(--edge)); color: var(--ink); }
:where(.screen.kulisse) .karte:not(.heldentat) { background-image: var(--k-ecken, none); background-position: var(--k-ecken-lage, 0 0); background-size: var(--k-ecken-groesse, auto); background-repeat: no-repeat; background-origin: border-box; }
/* Prunk-Rahmen (Version 117): nur auf Seiten mit Kulisse (KULISSE_SEITEN). Notfallkarte, Willkommen zurück und die Blätter
   („Heute war es schwer“ …) liegen außerhalb von .screen.kulisse und bleiben bewusst schlicht: in der Krise Klarheit statt Zierde.
   Stufe als Stein (Form aus --stufe-form, Farbe aus --glanz), Zierkante an Hauptknopf und Treffer-Siegel. Keine Größenänderung. */
.screen.kulisse .kl-stufe { background: linear-gradient(180deg, color-mix(in srgb, var(--glanz) 45%, #fff) 0%, var(--glanz) 52%, color-mix(in srgb, var(--glanz) 72%, #000) 100%); color: var(--auf-glanz); border-radius: var(--r-stufe); clip-path: var(--stufe-form); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.25); padding-inline: 12px; }

/* ---------- Kopfleiste und Neuigkeiten (31.10.2026, Startseite als Kampfbühne, Entscheidungen Abschnitt 18) ---------- */
.kopf-rechts { display: flex; align-items: center; gap: 8px; }

.start-kopf { gap: 8px; }

@media (max-width: 374px) { .schnellweg span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } .schnellweg { padding: 0 11px; } }
@media (max-width: 429px) { .kopf-rechts:has(.stapel) .schnellweg span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } .kopf-rechts:has(.stapel) .schnellweg { padding: 0 11px; } }
.wechsel-knopf.oben { min-height: 44px; padding: 4px 8px 4px 6px; gap: 4px; }

.kopfleiste { gap: 8px; }

.kl-bearbeiten { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; margin: -4px -4px 0 0; padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--card); color: var(--ac); font: 700 calc(12px * var(--text-skala, 1))/1 var(--fh); letter-spacing: .04em; cursor: pointer; }

.kopfleiste .weg { margin-top: 2px; }
.neuigkeiten { display: flex; flex-direction: column; gap: 10px; }
.neu-wartet { margin: 0; font-size: calc(14px * var(--text-skala, 1)); text-align: center; color: var(--mute); }
.tabs { background: var(--k-tabs-bg, var(--panel)); border-top: var(--k-tabs-rand, 1px solid var(--line)); box-shadow: var(--k-tabs-schatten, none); }
.tab { color: var(--k-tab-ink, var(--mute)); }
.tab.an { color: var(--k-tab-an, var(--ac)); }
.tab.an .tab-ic > .ic { filter: var(--k-tab-schein, none); }
/* Arena: Gegnerbild von Rand zu Rand, Fackelschein und aufsteigende Funken in Stilfarben, kein Helden-Medaillon */
.screen.start .karte.duell { --rand-l: max(24px, env(safe-area-inset-left, 0px)); --rand-r: max(24px, env(safe-area-inset-right, 0px)); width: calc(100% + var(--rand-l) + var(--rand-r)); max-width: none; margin-left: calc(-1 * var(--rand-l)); margin-right: calc(-1 * var(--rand-r)); border-radius: 0; border-left: 0; border-right: 0; }

.arena-funken { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }

/* Funken als Stoß beim Treffer (02.11.2026, Entscheidung 25): aus der Bildmitte nach oben und außen, einmal; Zeiten inline aus daten/bewegung.js */
.arena-funken.stoss i { bottom: 38%; width: 4px; height: 4px; }
@keyframes bw-funkenstoss { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(calc(var(--dx, 10px) * 4), -140px) scale(.35); opacity: 0; } }
.duell-titel { z-index: 2; }
@keyframes bw-fackel { 0%, 100% { opacity: .75; } 18% { opacity: .95; } 22% { opacity: .7; } 47% { opacity: .9; } 52% { opacity: .8; } 76% { opacity: 1; } }
@keyframes bw-glut { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(var(--dx, 10px), -200px); opacity: 0; } }
/* ---------- Kampfbühne (31.10.2026, Entscheidungen Abschnitt 18) ----------
   Eine Karte von Rand zu Rand: oben die Arena (Gegner, Kraft, Sprechblasen), darunter die Heldentat mit zwei Siegeln.
   Ablauf nach „Treffer“ über daten/bewegung.js (bw-treffer-wort, bw-zeigen, bw-ausblenden, bw-schrumpfen). Endzustände
   stehen hier im normalen CSS (Overlays unsichtbar), damit „Bewegung reduzieren“ nichts hängen lässt. */
.screen.start .karte.buehne { --rand-l: max(24px, env(safe-area-inset-left, 0px)); --rand-r: max(24px, env(safe-area-inset-right, 0px)); width: calc(100% + var(--rand-l) + var(--rand-r)); max-width: none; margin-left: calc(-1 * var(--rand-l)); margin-right: calc(-1 * var(--rand-r)); border-radius: 0; border-left: 0; border-right: 0; }

.arena { --arena-hoch: 230px; --arena-ruhe: 104px; --gegner-links: 36%; position: relative; height: var(--arena-hoch); overflow: hidden; background: var(--nacht); color: var(--auf-bild); }
.buehne.ruhe .arena { height: var(--arena-ruhe); }
.arena-tipp { cursor: pointer; -webkit-tap-highlight-color: transparent; } /* Version 96: ganze Arena öffnet das Gegnerblatt */
.arena::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; background: var(--arena-plateau); } /* Punkt 14 (02.11.2026): Plateau hinter Name und Kraft, vorher .15 auf Höhe des Namens */
.arena-bildrahmen { position: absolute; inset: 0; display: block; }

.arena-bild.grau { filter: grayscale(.85) brightness(.7); animation: none; }
.arena .bw-blitz-ebene { z-index: 3; }
.arena-text { position: absolute; left: var(--rand-l, 16px); right: var(--rand-r, 16px); bottom: 10px; z-index: 4; display: flex; flex-direction: column; gap: 5px; }
.gegner-zeile { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.gegner-name { padding: 0; border: 0; background: none; color: inherit; font: 800 calc(20px * var(--text-skala, 1))/1.15 var(--fh); text-align: left; text-shadow: 0 1px 6px rgba(0,0,0,.7); cursor: pointer; overflow-wrap: anywhere; }
span.gegner-name { cursor: default; }
.gegner-zeile small { flex: none; max-width: 50%; font: 500 calc(13px * var(--text-skala, 1))/1.25 var(--fb); opacity: .92; text-align: right; }
.gegner-zeile .gegner-name { min-width: 0; }
.arena .segmente i.voll { background: var(--schild-seg-voll); border-color: var(--schild-seg-voll); }
.kraft-zeile { display: flex; justify-content: space-between; gap: 8px; font: 600 calc(12px * var(--text-skala, 1)) var(--fb); opacity: .92; font-variant-numeric: tabular-nums; }
.buehne.ruhe .gegner-zeile small, .buehne.ruhe .kraft-zeile { display: none; }
.buehne.ruhe .gegner-name { font-size: calc(17px * var(--text-skala, 1)); }
/* Stempel am Siegtag („Der letzte Schlag“, 02.11.2026): bleibt stehen, bis die Bühne ruht; Wort je Stil (buehne.besiegt) */
.besiegt-stempel { position: absolute; top: 26%; left: 0; right: 0; z-index: 5; display: flex; justify-content: center; pointer-events: none; }
.besiegt-stempel b { display: inline-block; padding: 4px 14px; border: 3px solid var(--gegner); border-radius: 8px; color: var(--auf-bild); background: rgba(var(--schleier),.55); max-width: calc(100% - 32px); overflow-wrap: anywhere; text-align: center; font: 800 clamp(calc(22px * var(--text-skala, 1)), 7.6vw, 30px)/1.1 var(--fh); letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,.7); box-shadow: 0 4px 14px rgba(0,0,0,.5); }
.treffer-wort { position: absolute; top: 22%; left: 50%; z-index: 5; opacity: 0; transform: translateX(-50%); font: 800 calc(34px * var(--text-skala, 1)) var(--fh); color: var(--auf-bild); text-shadow: 0 2px 10px rgba(0,0,0,.75); pointer-events: none; white-space: nowrap; }
@keyframes bw-treffer-wort { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 25% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 70% { opacity: 1; transform: translate(-50%, -8px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -24px) scale(1); } }
.buehne-erfolg { position: absolute; left: 0; top: 0; bottom: 0; width: 44%; z-index: 3; opacity: 0; pointer-events: none; display: block; overflow: hidden; border-right: 3px solid var(--ac); -webkit-mask-image: linear-gradient(to right, #000 82%, rgba(0,0,0,.85)); mask-image: linear-gradient(to right, #000 82%, rgba(0,0,0,.85)); }
.buehne-erfolg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
/* „Der Held tritt ins Bild“ (02.11.2026): Gegnerbild und Kraft rücken für den Ablauf nach rechts; Endzustände nur im Ablauf */
.gegner-bild { position: absolute; top: 0; bottom: 0; left: 0; right: 0; display: block; overflow: hidden; }
/* Version 142 (Punkt 15a): Der Gegner steht rechts, sein Gesicht bleibt neben der Crew-Sprechblase frei. Bild wird neu
   zugeschnitten statt verschoben (Form „arena“, eigener Ausschnitt in der Bildpflege), keine zusätzliche Höhe.
   Links bleibt die Nacht der Arena mit dem Fackelschein; der Bildrand läuft weich aus. Geometrie: --gegner-links.
   Nur solange die Crew-Blase da ist: ohne Blase (gelesen, Ruhe) ist der Gegner wieder so breit wie die Arena. Weicht die
   Blase im Treffer-Ablauf, gleitet er zurück; mit Heldenbild rückt er von hier aus weiter nach rechts (--gegner-start). */
.gegner-bild { transition: left .45s cubic-bezier(.2,.8,.3,1); }
.arena:has(.crew-blase) { --gegner-start: var(--gegner-links); }
:is(.buehne.offen, .buehne.mit-held) .arena:has(.crew-blase) .gegner-bild { left: var(--gegner-links); -webkit-mask-image: linear-gradient(to right, transparent, #000 24%); mask-image: linear-gradient(to right, transparent, #000 24%); }
@keyframes bw-blase { 0% { opacity: 0; transform: translateY(-6px); } 6% { opacity: 1; transform: none; } 93% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-4px); } }
.blase-hinweis { display: block; margin-top: 4px; font: 600 calc(11px * var(--text-skala, 1)) var(--fb); font-style: normal; letter-spacing: .04em; opacity: .75; }
/* Restzeit der Sprechblase (02.11.2026): schmale Leiste, schrumpft über die Lesezeit; dezent, damit sie nicht drängt */
.blase-leiste { display: block; height: 2px; margin-top: 6px; border-radius: 1px; background: currentColor; opacity: .35; transform-origin: left center; transform: scaleX(0); }
@keyframes bw-leiste { from { transform: scaleX(1); } to { transform: scaleX(0); } }
/* Angehalten (Gedrückthalten oder „Nur per Tippen“): alle Bewegungen der Arena stehen an ihrer Stelle */
.arena.angehalten, .arena.angehalten * { animation-play-state: paused !important; }
@keyframes bw-held-rein { from { opacity: 0; transform: translateX(-100%); } to { opacity: 1; transform: none; } }
/* Gegner rechts neu zugeschnitten statt verschoben: sein Bildausschnitt (Gesicht in der Mitte) bleibt erhalten */
@keyframes bw-gegner-rechts { from { left: var(--gegner-start, 0); } to { left: 44%; } }
@keyframes bw-text-rechts { from { padding-left: 0; } to { padding-left: 44%; } }
.held-blase { position: absolute; left: 8px; right: 10px; bottom: 8px; z-index: 7; display: block; margin: 0; opacity: 0; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--edge); border-radius: 4px 14px 14px 14px; padding: 7px 10px; font: italic 500 calc(15px * var(--text-skala, 1))/1.35 var(--fi); box-shadow: 0 3px 8px rgba(0,0,0,.35); }
.held-blase b { display: block; margin-bottom: 2px; font: 700 calc(10px * var(--text-skala, 1)) var(--fh); font-style: normal; letter-spacing: .12em; color: var(--ac); }
/* Gegner-Blase im freien Platz unten links (wo der Held sprach), Spitze nach rechts zum Gegner: beide Gesichter und
   der Kraftbalken bleiben frei. Die Gegnerhälfte ist zu schmal für eine Blase, ohne ihn zu verdecken (02.11.2026). */
.boss-blase.neben-held { top: auto; left: 8px; right: auto; bottom: 8px; width: calc(44% - 22px); font-size: calc(14px * var(--text-skala, 1)); border-radius: 14px; }
.boss-blase.neben-held::after { content: ""; position: absolute; right: -9px; bottom: 18px; border: 8px solid transparent; border-right: 0; border-left: 9px solid var(--gegner); }
.held-blase::after { content: ""; position: absolute; left: 22px; top: -9px; border: 8px solid transparent; border-top: 0; border-bottom: 9px solid var(--edge); }
.buehne.mit-held .gegner-zeile small { display: none; }
.buehne.mit-held .gegner-name { font-size: calc(var(--schild-name-held) * var(--text-skala, 1)); overflow-wrap: normal; hyphens: auto; }
@keyframes bw-zeigen { 0% { opacity: 0; transform: translateY(-6px); } 12% { opacity: 1; transform: none; } 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-4px); } }
.boss-blase { position: absolute; top: 12px; right: var(--rand-r, 12px); left: 28%; z-index: 7; margin: 0; opacity: 0; pointer-events: none; background: var(--nacht); color: var(--nacht-ink); border: 1px solid var(--gegner); border-radius: 14px 4px 14px 14px; padding: 8px 11px; font: italic 500 calc(15px * var(--text-skala, 1))/1.35 var(--fi); box-shadow: 0 3px 10px rgba(0,0,0,.45); }
.boss-blase b, .blase-text b { display: block; margin-bottom: 2px; font: 700 calc(10px * var(--text-skala, 1)) var(--fh); font-style: normal; letter-spacing: .12em; }
.boss-blase b { color: var(--gegner); }
.boss-blase.art-phase { border-width: 2px; }
.crew-blase { position: absolute; top: 10px; left: var(--rand-l, 10px); right: auto; max-width: calc(var(--gegner-links) + 20%); z-index: 7; display: flex; gap: 8px; align-items: flex-start; padding: 0; border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.blase-bild { width: 38px; height: 38px; flex: none; border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 2px solid var(--auf-bild); box-sizing: border-box; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.blase-text { min-width: 0; background: var(--panel); color: var(--ink); border: 1px solid var(--edge); border-radius: 4px 14px 14px 14px; padding: 7px 10px; font: italic 500 calc(15px * var(--text-skala, 1))/1.35 var(--fi); box-shadow: 0 3px 8px rgba(0,0,0,.35); }
.blase-text b { color: var(--ac); }
/* Version 142: höchstens 3 Zeilen; der erste Tipp zeigt den ganzen Text (Klasse „ganz“), der nächste blendet aus */
.blase-satz { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
.crew-blase.ganz { max-width: none; right: var(--rand-r, 10px); }
.crew-blase.ganz .blase-text { max-height: calc(var(--arena-hoch) - 20px); overflow-y: auto; box-sizing: border-box; }
.crew-blase.ganz .blase-satz { display: block; -webkit-line-clamp: unset; line-clamp: none; overflow: visible; }
.crew-blase:focus-visible { outline: 3px solid var(--gut); outline-offset: 2px; }
@keyframes bw-ausblenden { to { opacity: 0; transform: translateY(-6px); visibility: hidden; } }
@keyframes bw-schrumpfen { from { height: var(--arena-hoch); } to { height: var(--arena-ruhe); } }
.glanz-wippen .blase-bild { animation: glanz-wippen .9s ease-in-out 2; transform-origin: 50% 90%; }
.glanz-siegel .lesen-knopf { animation: glanz-siegel 1.1s ease-in-out 3; }
/* Heldentat unter der Arena: Stilfarben der Heldentat (--tat-*), aber ohne eigenen Kartenrahmen */
.buehne .buehne-tat.heldentat { margin: 0; border: 0; border-radius: 0; box-shadow: none; display: flex; flex-direction: column; gap: 12px; padding: 16px var(--rand-r, 16px) 18px var(--rand-l, 16px); }
.buehne .buehne-tat.heldentat::before, .buehne .buehne-tat.heldentat::after { display: none; }
.buehne.ruhe .buehne-tat.heldentat { gap: 10px; padding-top: 12px; }
/* Rom: Tagesfrage auf Marmor statt auf Legionsrot (Kontrast, Entscheidung 31.10.2026); Rot bleibt dort, wo man handelt */
:root[data-stil="rom"] .buehne .buehne-tat.heldentat { --tat-bg: var(--panel); --tat-ink: var(--ink); --tat-feld: var(--tief); --tat-linie: var(--line); --tat-leise: var(--soft);
  --tat-wenn: var(--ac); --tat-dann: var(--gut-text); --tat-akzent: var(--ac); --tat-auf-akzent: var(--auf-ac); --tat-akzent-dunkel: var(--ac-dunkel); box-shadow: inset 0 3px 0 var(--ac), inset 0 4px 0 var(--edge); }

/* Version 90: Siegel füllen die Breite (je halbe Karte als Tippfläche, höchstens 220px), damit die Hauptaktion leicht zu treffen ist */
.tat-siegel-reihe { display: flex; justify-content: center; gap: 12px; padding-top: 2px; }
.tat-siegel { flex: 1 1 0; max-width: 220px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 44px; padding: 6px 4px; border: 0; border-radius: 14px; background: none; color: var(--tat-ink); font: 700 calc(14px * var(--text-skala, 1))/1.2 var(--fh); letter-spacing: .04em; text-align: center; cursor: pointer; }
.siegel-rund { position: relative; width: 76px; height: 76px; display: grid; place-items: center; border-radius: var(--r-siegel); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -4px 0 rgba(0,0,0,.25), 0 4px 8px rgba(0,0,0,.3); transition: transform .12s ease, box-shadow .12s ease; }
