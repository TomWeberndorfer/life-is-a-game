/* Layout: eine Spalte wie eine Handy-App, max. 480px, Bildschirme mit festem Fuß für die Hauptaktion.

:root, :root[data-stil="fantasy"] {
  color-scheme: light;

  --r: 6px; --r-cta: 28px; --schatten: 0 3px 0 var(--line);
  /* Stil-Tokens (Version 116): Werte, die früher fest an einzelnen Stellen standen. Fantasy ist der Rückfall;
     eigene Werte je Stil seit Version 117 (Prunk-Rahmen, Block „Stil-Tokens je Stil“ unten). Farben als RGB-Liste (*-rgb, --schleier) für rgba(var(--x), .5). */
  --auf-bild: #FBF3DE; --auf-bild-rgb: 251,243,222; --schleier: 10,8,5;
  --glanz: #E9C46A; --glanz-rgb: 233,196,106; --auf-glanz: #2E2114;
  --wachs-hell: #F8E39B; --wachs-mitte: #E2B44C; --wachs-dunkel: #A97A1E; --auf-wachs: #3A2508;
  --feuer-glut: #FFB347; --feuer-kern: #FFE9A8; --feuer-funke: #FFC86B;
  --gegner-schein-rgb: 181,71,47; --gut-schein-rgb: 63,125,78;
  /* Form je Stil (statt Sonderregeln je Selektor): Rundung von Siegel, Feuer-Siegel, Kachel-Symbol und Kachel, dazu Schein */
  --r-siegel: 50%; --r-siegel-klein: 50%; --r-kachel-ic: 50%; --r-kachel: var(--r);
  --siegel-treffer-schatten: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -4px 0 rgba(0,0,0,.25), 0 4px 8px rgba(0,0,0,.3);
  --kachel-ic-schatten: none; --kachel-schatten: none; --kachel-schatten-hover: var(--kachel-schatten);

  --prunk-kante: #B8862F; --r-stufe: 2px; --stufe-form: polygon(7px 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 7px 100%, 0 50%);

     Rückfall = Nachtfarben des Stils; Fantasy: Nachthimmel mit Sternen. */

  --abend-deko: radial-gradient(1.5px 1.5px at 14% 28%, rgba(246,234,203,.85), transparent), radial-gradient(1px 1px at 31% 14%, rgba(246,234,203,.7), transparent), radial-gradient(1.5px 1.5px at 68% 20%, rgba(246,234,203,.8), transparent), radial-gradient(1px 1px at 84% 36%, rgba(246,234,203,.65), transparent), radial-gradient(1px 1px at 52% 9%, rgba(246,234,203,.6), transparent);
  /* Briefpapier des Rückblicks (Version 123): Papier immer im Stil, Zierrand und Siegelglanz nur nach einem Sieg (Entscheidung 7a) */
  --brief-papier: linear-gradient(180deg, var(--card) 0%, var(--tief) 100%); --brief-muster: none; --brief-rand: var(--line);
}

body { background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: calc(17px * var(--text-skala, 1)); }
#app { position: relative; max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-verlauf); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
.ic { width: 22px; height: 22px; flex: none; }
.ic.gross { width: 54px; height: 54px; stroke-width: 1.7; }

.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
.screen.dunkel { background: var(--nacht-verlauf); color: var(--nacht-ink); --soft: var(--nacht-soft); --mute: var(--nacht-soft); }
.inhalt { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-block: 12px 4px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.inhalt.mitte { align-items: center; text-align: center; justify-content: flex-start; padding-top: 28px; }
.inhalt.hoch { margin-top: -44px; position: relative; }
.fuss { flex: none; display: flex; flex-direction: column; gap: 8px; padding-block: 14px 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

h1 { margin: 0; font: 700 calc(25px * var(--text-skala, 1))/1.2 var(--fh); text-wrap: balance; }
h1.mittel { font-size: calc(22px * var(--text-skala, 1)); line-height: 1.28; }
h1.name { font-size: calc(30px * var(--text-skala, 1)); font-weight: 800; }
.lead { margin: 0; font-size: calc(17px * var(--text-skala, 1)); line-height: 1.4; color: var(--soft); }
.frage { margin: 4px 0 0; font-weight: 700; font-size: calc(19px * var(--text-skala, 1)); }
.rolle { margin: 0; font: italic 500 calc(18px * var(--text-skala, 1)) var(--fi); color: var(--soft); }
.stark { margin: 4px 0 0; font-weight: 700; font-size: calc(18px * var(--text-skala, 1)); }
.klein { font-size: calc(15px * var(--text-skala, 1)); line-height: 1.35; color: var(--mute); margin: 0; }
.mitte-text { text-align: center; }
.eyebrow { font: 700 calc(12px * var(--text-skala, 1)) var(--fh); letter-spacing: .12em; color: var(--mute); margin: 0; }
.eyebrow.akzent { color: var(--ac); }
.gut-text { color: var(--gut-text); }

/* Onboarding-Kopf */
.ob-kopf { flex: none; display: flex; align-items: center; gap: 8px; min-height: 60px; padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ob-kopf.ueber { position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
.ob-kopf.hell { color: var(--auf-bild); }
.icbtn, .icplatz { width: 44px; height: 44px; flex: none; }
.icbtn { border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; color: inherit; }
.einst-btn { background: var(--panel); border: 1.5px solid var(--edge); box-shadow: 0 2px 0 var(--line); color: var(--ink); }
.einst-btn .ic { width: 26px; height: 26px; stroke-width: 1.9; }
.einst-btn:active { transform: translateY(1px); box-shadow: none; }
.prog { flex: 1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.prog i { height: 6px; border-radius: 3px; background: var(--line); }
.prog i.on { background: var(--ac); }
.ob-kopf.hell .prog i { background: rgba(var(--auf-bild-rgb),.45); }
.ob-kopf.hell .prog i.on { background: var(--auf-bild); }
.screen.dunkel .prog i.on { background: var(--gegner); }
.schritt { font: 700 calc(12px * var(--text-skala, 1)) var(--fh); }
.ob-abbrechen { flex: none; min-height: 44px; padding: 0 4px; font-size: calc(15px * var(--text-skala, 1)); }

.ob-bild { position: relative; flex: none; overflow: hidden; }
.ob-bild.klein { height: 170px; }
.ob-bild.mittel { height: 210px; }
.ob-bild.gross { height: 360px; }
.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.verlauf { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, var(--bg) 100%); }
.verlauf.dunkel-oben { background: linear-gradient(180deg, rgba(var(--schleier),.5) 0%, transparent 25%, transparent 55%, var(--bg) 100%); }

/* Auswahl */
.optionen { display: flex; flex-direction: column; gap: 8px; }
.opt { min-height: 56px; width: 100%; text-align: left; padding: 8px 16px; border-radius: var(--r); border: 2px solid var(--line); background: var(--card); box-shadow: var(--schatten); font-size: calc(18px * var(--text-skala, 1)); font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 12px; cursor: pointer; }
.opt .ic { color: var(--mute); }
.opt.sel { border-color: var(--ac); background: var(--sel); box-shadow: 0 3px 0 var(--ac-dunkel); }
.opt.sel .ic { color: var(--ac); }
.opt.leise { font-style: italic; color: var(--soft); }
.chip { align-self: flex-start; padding: 4px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font: 700 calc(12px * var(--text-skala, 1)) var(--fh); letter-spacing: .08em; color: var(--ac); }
.chip.gut { background: var(--gut); color: var(--auf-gut); border-color: var(--gut); }
.chip.schlecht { background: var(--gegner); color: var(--auf-gegner); border-color: var(--gegner); }
.inhalt.mitte .chip { align-self: center; }
.feld { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: calc(15px * var(--text-skala, 1)); color: var(--mute); }
.feld input { min-height: 52px; box-sizing: border-box; width: 100%; border-radius: var(--r); border: 2px solid var(--line); background: var(--panel); color: var(--ink); padding: 0 14px; font: 500 calc(17px * var(--text-skala, 1)) var(--fb); }
.notiz { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--tief); border: 1px dashed var(--edge); }
.notiz p { margin: 0; font: italic 500 calc(16px * var(--text-skala, 1))/1.4 var(--fi); color: var(--soft); }

.cta { min-height: 56px; width: 100%; border-radius: var(--r-cta); border: 2px solid var(--ac-dunkel); background: var(--ac); color: var(--auf-ac); box-shadow: 0 3px 0 var(--ac-dunkel); font: 800 calc(16px * var(--text-skala, 1)) var(--fh); letter-spacing: .02em; cursor: pointer; }
.cta.rot { background: var(--gegner); color: var(--auf-gegner); border-color: var(--ac-dunkel); }
.cta:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.cta:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ac-dunkel); }
.link { min-height: 44px; border: 0; background: none; color: inherit; font: italic 500 calc(16px * var(--text-skala, 1)) var(--fi); text-decoration: underline; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.btn { min-height: 52px; padding: 0 12px; border-radius: var(--r-cta); border: 2px solid var(--edge); background: var(--panel); color: var(--ink); box-shadow: 0 3px 0 var(--edge); font: 800 calc(14px * var(--text-skala, 1))/1.2 var(--fh); cursor: pointer; }
.btn.voll { background: var(--ac); color: var(--auf-ac); border-color: var(--ac-dunkel); box-shadow: 0 3px 0 var(--ac-dunkel); }
.btn.warn { background: var(--gegner); color: var(--auf-gegner); border-color: var(--gegner); }
/* Einwilligung (Version 28) */
.btn.ja { background: var(--gut); color: var(--auf-gut); border-color: var(--gut); }
.einw-mehr summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
.einw-mehr p { margin-top: 4px; }
.einw-ok { display: flex; align-items: center; gap: 6px; color: var(--gut-text); }
.btn:active { transform: translateY(2px); box-shadow: none; }

/* Analyse */
.ring { position: relative; width: 190px; height: 190px; }
.ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: dreh 6s linear infinite; }
.ring.still > svg { animation: none; }
.ring .r1 { fill: none; stroke: var(--edge); stroke-width: 2; stroke-dasharray: 4 8; }
.ring .r2 { fill: none; stroke: var(--ac); stroke-width: 3; stroke-dasharray: 120 345; stroke-linecap: round; }
.ring > span { position: absolute; inset: 30px; border-radius: 50%; background: var(--panel); border: 2px solid var(--edge); display: flex; align-items: center; justify-content: center; color: var(--ac); }
@keyframes dreh { to { transform: rotate(360deg); } }
.analyse-liste { list-style: none; margin: 8px 0 0; padding: 0; align-self: stretch; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.analyse-liste li { display: flex; align-items: center; gap: 14px; min-height: 44px; font-size: calc(19px * var(--text-skala, 1)); color: var(--mute); }
.analyse-liste li.ok { color: var(--ink); }
.analyse-liste li.jetzt { color: var(--ink); font-weight: 700; }
.dot { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid var(--edge); box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
.dot .ic { width: 16px; height: 16px; stroke-width: 3.2; }
li.ok .dot { background: var(--gut); border-color: var(--gut); color: var(--auf-gut); }
li.jetzt .dot { background: var(--ac); border-color: var(--ac); animation: puls 1.2s ease-in-out infinite; }
@keyframes puls { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

/* Verbündeter, Gegner, Fähigkeit */
.haken { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.haken li { display: flex; gap: 10px; align-items: flex-start; font-size: calc(18px * var(--text-skala, 1)); line-height: 1.35; }
.haken .ic { color: var(--gut); stroke-width: 2.6; margin-top: 2px; width: 20px; height: 20px; }
.boss-bild { position: relative; height: 260px; border-radius: 8px; overflow: hidden; border: 2px solid var(--gegner); box-shadow: 0 0 0 4px rgba(var(--gegner-schein-rgb),.25); }
.kraft { display: flex; align-items: center; gap: 8px; font: 700 calc(11px * var(--text-skala, 1)) var(--fh); }
.balken { flex: 1; height: 10px; border-radius: 5px; overflow: hidden; background: var(--tief); border: 1px solid var(--edge); }
.balken i { display: block; height: 100%; background: var(--gut); transition: width .6s ease; }
.balken.boss i { background: var(--gegner); }
.balken.xp { height: 6px; margin-top: 4px; }
.balken.xp i { background: var(--ac); }
.zwei { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.box { min-width: 0; padding: 12px; border-radius: var(--r); display: flex; flex-direction: column; gap: 6px; font-size: calc(16px * var(--text-skala, 1)); line-height: 1.35; }
.box b { font: 700 calc(12px * var(--text-skala, 1)) var(--fh); letter-spacing: .06em; }
.box.schlecht { background: rgba(var(--gegner-schein-rgb),.2); border: 1px solid var(--gegner); }
.box.gut { background: rgba(var(--gut-schein-rgb),.25); border: 1px solid var(--gut); }
.karte { background: var(--card); border: 2px solid var(--edge); border-radius: 8px; box-shadow: 0 3px 0 var(--edge); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.karte.faehigkeit { align-items: center; gap: 14px; padding: 22px 20px; }
.karte.faehigkeit .wenn { align-self: flex-start; margin: 0; font: italic 500 calc(17px * var(--text-skala, 1)) var(--fi); color: var(--soft); }
.karte.faehigkeit .haken { align-self: stretch; }
.medaille { width: 92px; height: 92px; border-radius: 50%; background: var(--tief); border: 2px solid var(--ac); color: var(--ac); display: flex; align-items: center; justify-content: center; flex: none; }
.medaille.klein-m { width: 44px; height: 44px; }
.gegen { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r); background: var(--tief); border: 1px solid var(--line); font-size: calc(16px * var(--text-skala, 1)); line-height: 1.35; }
.rund { width: 44px; height: 44px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid var(--gegner); box-sizing: border-box; }
.siegel-reihe { display: flex; gap: 14px; justify-content: center; }
.siegel { width: 54px; height: 54px; border-radius: 50%; border: 2px dashed var(--edge); background: var(--tief); display: flex; align-items: center; justify-content: center; font: 800 calc(18px * var(--text-skala, 1)) var(--fh); color: var(--mute); flex: none; }
.siegel.voll { background: var(--ac); border: 2px solid var(--ac-dunkel); color: var(--auf-ac); }
.belohnung { list-style: none; margin: 0; padding: 0 4px; display: flex; flex-direction: column; gap: 10px; }
.belohnung li { display: flex; align-items: center; gap: 12px; font-size: calc(17px * var(--text-skala, 1)); }
.rund-ic { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.rund-ic.gut { background: var(--gut); color: var(--auf-gut); }

/* Startseite */
.start-kopf { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.datum { font: 700 calc(15px * var(--text-skala, 1)) var(--fh); color: var(--mute); }
.start-inhalt { gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.questtitel { font: 800 calc(22px * var(--text-skala, 1))/1.2 var(--fh); text-wrap: balance; }
/* Quest bearbeiten (Version 38) */
.quest-warum { margin: 2px 0 0; font: italic 500 calc(16px * var(--text-skala, 1))/1.35 var(--fi); color: var(--soft); }
.quest-zeile { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.qe-knopf { flex: none; min-height: 44px; font-size: calc(15px * var(--text-skala, 1)); color: var(--mute); margin-top: -10px; }
.qe-knopf .ic { width: 18px; height: 18px; }
.qe-anzahl .opt.kurz { flex: 1 0 40px; min-width: 40px; padding: 6px 0; }
.zeile { display: flex; align-items: center; gap: 10px; }
.mini { font: 700 calc(12px * var(--text-skala, 1)) var(--fh); }
.nm { font: 700 calc(16px * var(--text-skala, 1)) var(--fh); overflow-wrap: anywhere; }
.gross-nm { font-size: calc(18px * var(--text-skala, 1)); }
.segmente { display: flex; gap: 3px; margin-top: 2px; }
.segmente i { flex: 1; height: 8px; border-radius: 2px; background: var(--tief); border: 1px solid var(--gegner); transition: background .4s; }
.segmente i.voll { background: var(--gegner); }
.karte.besiegt .duell-bild { filter: grayscale(.85) brightness(.85); }
/* Duell-Karte (Version 45): breites Gegnerbild mit „Held vs Gegner“, darunter Lebensbalken */
.karte.duell { padding: 0; gap: 0; overflow: hidden; }
.duell-bildrahmen { position: relative; display: block; height: 180px; }
.duell-bild { width: 100%; height: 180px; object-fit: cover; display: block; }
.duell-titel { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 10px; background: linear-gradient(to top, rgba(var(--schleier),.85), rgba(var(--schleier),0)); color: var(--auf-bild); font: 800 calc(19px * var(--text-skala, 1))/1.2 var(--fh); }
.duell-vs { color: var(--glanz); }
.duell-text { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px 12px; }
.duell-zeile { display: flex; justify-content: space-between; gap: 8px; font: 700 calc(14px * var(--text-skala, 1)) var(--fh); }
.duell .segmente i { height: 10px; }
.wackelt { animation: wackel .5s ease; }
@keyframes wackel { 20% { transform: translateX(-6px) rotate(-1deg); } 40% { transform: translateX(5px) rotate(1deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.xpflug { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); padding: 4px 10px; border-radius: 14px; background: var(--ac); color: var(--auf-ac); font: 800 calc(15px * var(--text-skala, 1)) var(--fh); animation: steig 1.2s ease-out forwards; pointer-events: none; }
@keyframes steig { from { transform: translate(-50%, 10px); opacity: 0; } 20% { opacity: 1; } to { transform: translate(-50%, -30px); opacity: 0; } }
.zeile-karte { flex-direction: row; align-items: center; gap: 12px; padding: 10px 12px; }
.spalte { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.karte.spalte { gap: 8px; }
.karte.aufgabe { background: var(--sel); border-color: var(--ac); box-shadow: 0 3px 0 var(--ac-dunkel); }
.siegel-zeile { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.siegel-zeile .siegel { width: 40px; height: 40px; }
.siegel-zeile .siegel .ic { width: 18px; height: 18px; stroke-width: 3.2; }
.rechts { margin-left: auto; font-style: italic; }
.erledigt { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 4px 0 12px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--gut); color: var(--gut-text); font-weight: 700; }
.erledigt span { flex: 1; color: var(--ink); }
.erledigt .link { font-size: calc(15px * var(--text-skala, 1)); color: var(--mute); }
.start-fuss { flex: none; text-align: center; padding-block: 10px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font: italic 500 calc(15px * var(--text-skala, 1)) var(--fi); color: var(--mute); }
.hinweis { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border: 1px solid var(--gegner); border-radius: var(--r); background: var(--panel); font-size: calc(15px * var(--text-skala, 1)); line-height: 1.35; }
.hinweis span { flex: 1; }

/* Stilwahl */
.welten { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-self: stretch; }
.welt { position: relative; height: 112px; border-radius: var(--r); overflow: hidden; border: 2px solid var(--edge); padding: 0; background: var(--nacht); cursor: pointer; }
.welt img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.welt span { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; background: linear-gradient(180deg, transparent, rgba(var(--schleier),.88)); color: var(--auf-bild); font: 700 calc(14px * var(--text-skala, 1)) var(--fh); text-align: left; }
/* Stilfrage am Start (Version 163): drei Kacheln nebeneinander, niedriger als in der Weltenwahl */
.welten.start { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.welten.start .welt { height: 96px; }
.welten.start .welt span { padding: 16px 6px 6px; font-size: calc(13px * var(--text-skala, 1)); }
.welt.sel { border: 3px solid var(--glanz); box-shadow: 0 0 0 3px rgba(var(--glanz-rgb),.35); }
.welt.gesperrt { cursor: not-allowed; }
.welt.gesperrt img { filter: grayscale(1) brightness(.45); }
.welt.gesperrt span:last-child { color: rgba(var(--auf-bild-rgb),.7); }
.welt .welt-schloss { position: absolute; top: 8px; right: 8px; left: auto; bottom: auto; padding: 0; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: rgba(var(--schleier),.7); color: var(--auf-bild); }
.welt .welt-schloss svg { width: 16px; height: 16px; }
.stilwahl-inhalt { padding-top: 16px; gap: 10px; }
.stil-kopf { display: flex; align-items: center; gap: 12px; align-self: stretch; text-align: left; }
.stil-kopf .stern-klein { width: 48px; height: 48px; box-shadow: 0 0 0 5px rgba(var(--glanz-rgb),.2); }
.stil-kopf .stern-klein .ic { width: 26px; height: 26px; }
.stil-kopf-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stilwahl-inhalt .stil-kopf-text .chip { align-self: flex-start; font-size: calc(11px * var(--text-skala, 1)); padding: 3px 10px; }
.stil-titel { font-size: calc(19px * var(--text-skala, 1)); line-height: 1.2; }
.stern-gross { width: 76px; height: 76px; border-radius: 50%; background: var(--glanz); color: var(--auf-glanz); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(var(--glanz-rgb),.2); }
.stern-gross .ic { width: 40px; height: 40px; }

/* Feier */
.feier { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); background: rgba(var(--schleier),.72); }
.feier-karte { width: 100%; background: var(--panel); color: var(--ink); border: 2px solid var(--edge); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
.feier-karte h2 { margin: 0; font: 800 calc(22px * var(--text-skala, 1))/1.25 var(--fh); text-wrap: balance; }
.feier-karte p { margin: 0; color: var(--soft); line-height: 1.4; }
.feier-bild { position: relative; width: 100%; height: 170px; border-radius: 8px; overflow: hidden; }
/* Version 111: großer Auftritt eines Gegners (Bildform „auftritt“). Bild fast quadratisch, Name auf dem Bild,
   Text scrollt bei Bedarf, der Knopf bleibt unten sichtbar. „Verliert Kraft“ steht ohne Antippen da. */
.feier-karte.auftritt-karte { padding: 0; gap: 0; max-height: calc(100% - 32px); overflow: hidden; }
.auftritt-karte > * { width: 100%; box-sizing: border-box; }
/* Version 132: EINE Größe für alle großen Gegnerbilder (Auftritt, Gegnerblatt, Rückschau auf der Karte, Onboarding).
   Stellen ändern nur die Variablen, nie die Regel selbst. Vorlage: gegnerKopfHtml in js/ansicht/helfer.js. */
:root { --auftritt-max: 56vh; --auftritt-min: 200px; }
.gegner-kopf, .boss-bild.auftritt { position: relative; overflow: hidden; height: auto; aspect-ratio: 1 / 1; max-height: var(--auftritt-max); min-height: var(--auftritt-min); }
.gegner-kopf.blatt-kopf { flex: none; width: 100%; border-radius: 18px 18px 0 0; }
.blatt-kopf .auftritt-name h2 { margin: 0; color: var(--auf-bild); font: 800 calc(24px * var(--text-skala, 1))/1.25 var(--fh); text-align: center; text-wrap: balance; }
.feier-bild.auftritt { flex: 0 1 auto; border-radius: 8px 8px 0 0; }
.auftritt-name { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 48px 16px 14px; background: linear-gradient(180deg, transparent 0%, rgba(var(--schleier),.55) 45%, rgba(var(--schleier),.85) 100%); }
.auftritt-name h2 { color: var(--auf-bild); text-shadow: 0 2px 6px rgba(0,0,0,.6); }
.auftritt-karte .chip, .auftritt-name .chip { align-self: center; }
.auftritt-text { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 4px; }
.auftritt-fuss { flex: none; padding: 10px 20px 20px; }
/* Version 115: Vorstellung am Siegtag (Einführung vor Anzeige) */
.auftritt-fuss { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.auftritt-fuss .cta { align-self: stretch; }
/* Aura je Gegner (05.11.2026, daten/aura.js, Entscheidung 25): ein kurzer Effekt über dem Gegnerbild, einmal bei der
   Vorstellung, nie dauernd. Grundzustand unsichtbar (opacity 0): ohne Bewegung bleibt er weg. Kein z-index, damit Name und
   Chip (später im DOM) darüber liegen. Farben nur aus Stil-Tokens. Flackern bewusst schwach (kein heller Blitz). */
.aura-ebene { position: absolute; inset: 0; pointer-events: none; overflow: hidden; opacity: 0; animation: bw-aura-huelle var(--aura-ms, 2800ms) ease-out both; }
.aura-ebene i { position: absolute; left: var(--x, 50%); top: var(--y, 50%); opacity: 0; animation-duration: calc(var(--aura-ms, 2800ms) * .66); animation-timing-function: ease-out; animation-fill-mode: both; }
@keyframes bw-aura-huelle { 0% { opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
.aura-funken i { top: auto; bottom: 6%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--feuer-kern); box-shadow: 0 0 10px 3px var(--feuer-funke), 0 0 18px 6px var(--feuer-glut); animation-name: bw-aura-funke; }
@keyframes bw-aura-funke { 0% { opacity: 0; transform: translate(0, 0) scale(var(--s, 1)); } 10% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(calc((var(--s, 1) - 1) * 60px), -240px) scale(calc(var(--s, 1) * .35)); } }
.aura-glut i { top: auto; bottom: -50px; width: 150px; height: 150px; margin-left: -75px; border-radius: 50%; background: radial-gradient(circle, var(--feuer-kern) 0%, var(--feuer-glut) 30%, transparent 68%); mix-blend-mode: screen; animation-name: bw-aura-glut; }
@keyframes bw-aura-glut { 0% { opacity: 0; transform: translateY(0) scale(calc(var(--s, 1) * .6)); } 35% { opacity: .9; } 70% { opacity: .75; } 100% { opacity: 0; transform: translateY(-110px) scale(calc(var(--s, 1) * 1.4)); } }
.aura-nebel i { left: -40%; width: 180%; height: 55%; margin-top: -14%; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(var(--auf-bild-rgb), .75) 0%, rgba(var(--auf-bild-rgb), .3) 40%, transparent 68%); filter: blur(4px); animation-name: bw-aura-nebel; animation-duration: var(--aura-ms, 3600ms); animation-timing-function: ease-in-out; }
@keyframes bw-aura-nebel { 0% { opacity: 0; transform: translateX(-22%); } 40% { opacity: 1; } 75% { opacity: .8; } 100% { opacity: 0; transform: translateX(22%); } }
.aura-flackern i, .aura-schatten i { left: 0; top: 0; width: 100%; height: 100%; animation-duration: var(--aura-ms, 2200ms); }
.aura-flackern i { background: radial-gradient(ellipse at center, rgba(var(--glanz-rgb), .45) 0%, rgba(var(--glanz-rgb), .2) 60%, transparent 100%); mix-blend-mode: screen; animation-name: bw-aura-flackern; animation-timing-function: steps(1, end); }
@keyframes bw-aura-flackern { 0% { opacity: 0; } 8% { opacity: 1; } 16% { opacity: .25; } 26% { opacity: .9; } 38% { opacity: .15; } 50% { opacity: .8; } 64% { opacity: .3; } 76% { opacity: .7; } 90%, 100% { opacity: 0; } }
.aura-schatten i { background: radial-gradient(ellipse at center, transparent 22%, rgba(var(--schleier), .92) 100%); animation-name: bw-aura-schatten; }
@keyframes bw-aura-schatten { 0% { opacity: 0; transform: scale(1.4); } 35% { opacity: 1; transform: scale(1); } 75% { opacity: .9; transform: scale(1.02); } 100% { opacity: 0; transform: scale(1.15); } }
:root[data-bewegung="aus"] .aura-ebene { display: none; }
@media (prefers-reduced-motion: reduce) { .aura-ebene { display: none; } }
.vorstellung-crew { display: flex; align-items: flex-start; gap: 10px; margin: 0; font-style: italic; }
.vorstellung-crew b { font-style: normal; letter-spacing: .04em; font-size: .8em; }
.vorstellung-morgen { margin: 0; }
.vorstellung-hinweis { display: flex; align-items: center; gap: 8px; margin: 8px auto 0; text-align: left; opacity: .9; }
.boss-bild.auftritt { --auftritt-max: 52vh; }
.grau { filter: grayscale(.7) brightness(.8); }
.erscheint { animation: auf .55s ease-out; }
@keyframes auf { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
/* Übergangs-Muster (Version 162, Werte aus daten/bewegung.js → --bw-blatt/-feier/-ruhe/-tab): Blatt von unten, Feier sanft ein,
   Ruhe-Seite überblenden, Tab kurz überblenden. Alles hängt an .erscheint (ohneEinblendung() entfernt es bei jedem Neuzeichnen
   derselben Ebene). Schließen ist sofort. Sieg-Karte (Stempel/Kapitelsieg) und Notfallkarte behalten ihr eigenes Verhalten. */
.blatt.erscheint, .frage-blatt.erscheint { animation: bw-blatt var(--bw-blatt, 280ms) var(--bw-blatt-kurve, cubic-bezier(.2,.8,.3,1)) both; }
@keyframes bw-blatt { from { transform: translateY(100%); } to { transform: none; } }
.feier.unten:has(.erscheint) { animation: bw-schleier var(--bw-blatt, 280ms) ease-out both; }
@keyframes bw-schleier { from { background-color: rgba(var(--schleier), 0); } to { background-color: rgba(var(--schleier), .72); } }
.feier-karte.erscheint:not(.sieg-karte) { animation: bw-feier var(--bw-feier, 320ms) var(--bw-feier-kurve, ease-out) both; }
@keyframes bw-feier { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
.feier.ruhe-seite.erscheint { animation: bw-ruhe var(--bw-ruhe, 300ms) var(--bw-ruhe-kurve, ease-in-out) both; }
@keyframes bw-ruhe { from { opacity: 0; } to { opacity: 1; } }
.screen.seite-wechsel { animation: bw-tab var(--bw-tab, 150ms) var(--bw-tab-kurve, ease-out) both; }
@keyframes bw-tab { from { opacity: 0; } to { opacity: 1; } }

.blase b { display: block; font: 700 calc(12px * var(--text-skala, 1)) var(--fh); letter-spacing: .08em; font-style: normal; color: var(--gut-text); margin-bottom: 2px; }
.story-karte { flex-direction: row; align-items: center; gap: 12px; }

.mikro { gap: 6px; }

.teil.gesperrt h3 { color: var(--mute); }
.story-blatt { align-items: stretch; text-align: left; max-height: 86vh; overflow-y: auto; }
/* Story-Popup als Kapitelmoment (Version 40): Bild oben, Text erscheint kurz danach; ohne Bewegung bei „Bewegung reduzieren“ */
.story-moment { padding-top: 0; gap: 14px; }
.story-bild { position: relative; flex: none; height: 190px; margin: 0 -20px; overflow: hidden; border-radius: 8px 8px 0 0; background: var(--tief); }
.story-bild img { animation: story-nah 7s ease-out both; }
.story-bild-verlauf { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, var(--panel) 100%); }
.story-text { display: flex; flex-direction: column; gap: 8px; margin-top: -28px; position: relative; animation: story-auf .6s .25s ease-out both; }
.story-text h2 { text-align: left; }

.story-absatz { font-size: calc(18px * var(--text-skala, 1)); line-height: 1.55; color: var(--ink) !important; max-width: 65ch; }
.story-folgt { font: italic 500 calc(16px * var(--text-skala, 1)) var(--fi); color: var(--mute) !important; }
@keyframes story-nah { from { transform: scale(1.08); } to { transform: scale(1); } }
@keyframes story-auf { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* Geheimnisvolle Story (Version 48): Siegel, eingeklappte Teile, Nebel, Satz für Satz */
.story-neu { border-color: var(--ac); }
.siegel-mark { width: 46px; height: 46px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--ac); color: var(--auf-ac); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 25%, transparent); }
.story-karte .siegel-mark .ic { width: 26px; height: 26px; color: var(--auf-ac); }
.story-andeutung { font: italic 500 calc(16px * var(--text-skala, 1))/1.4 var(--fi); color: var(--ink); }
.story-hinweis { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 4px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--mute); text-align: left; font: 500 calc(15px * var(--text-skala, 1))/1.35 var(--fb); cursor: pointer; }
.story-hinweis .ic { width: 20px; height: 20px; flex: none; color: var(--ac); }
.story-hinweis .klein { color: var(--mute); }
.teil.gelesen summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 44px; }
.teil.gelesen summary::-webkit-details-marker { display: none; }
.teil.gelesen summary h3::after { content: ' ▾'; color: var(--mute); font-size: calc(14px * var(--text-skala, 1)); }
.teil.gelesen[open] summary h3::after { content: ' ▴'; }
.teil.gelesen p { margin-top: 6px; }
.teil.versiegelt { padding: 12px 14px; border: 2px dashed var(--edge); border-radius: 12px; gap: 8px; }
.teil.frei-siegel { border-style: solid; border-color: var(--ac); }
.andeutung { margin: 0; font: italic 500 calc(17px * var(--text-skala, 1))/1.45 var(--fi) !important; color: var(--ink); }
.siegel-knopf { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; }
.siegel-knopf .ic { width: 20px; height: 20px; }
.teil.nebel { position: relative; min-height: 64px; justify-content: center; align-items: center; border-radius: 12px; overflow: hidden; }
.nebel-schleier { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--mute) 22%, transparent), transparent); filter: blur(8px); }
.teil.nebel .klein { position: relative; font-style: italic; }
.teil.gebrochen summary { animation: siegel-bricht 520ms cubic-bezier(.2,.8,.3,1) both; }
.satz { opacity: 0; animation: story-auf .5s ease-out forwards; animation-delay: calc(300ms + var(--i, 0) * 650ms); }
@keyframes siegel-bricht { 0% { transform: scale(.94); opacity: .4; filter: blur(2px); } 60% { transform: scale(1.02); opacity: 1; filter: none; } 100% { transform: none; } }
/* Momente der Startseite (Version 49): großes Heldenbild nach „Ja“, Banner beim Heldenwechsel */
.erfolg-bild { position: relative; margin: 0; height: 210px; border-radius: var(--r); overflow: hidden; background: var(--nacht); border: 2px solid var(--panel); }
.erfolg-bild.neu { animation: erfolg-auf 650ms cubic-bezier(.2,.8,.3,1) both; }
.erfolg-bild.neu img { animation: story-nah 5s ease-out both; }
.erfolg-verlauf { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(var(--schleier),0) 40%, rgba(var(--schleier),.85) 100%); }
.erfolg-bild figcaption { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; flex-direction: column; gap: 2px; color: var(--auf-bild); }
.erfolg-bild figcaption .eyebrow { color: var(--glanz); }
.erfolg-text { font: 700 calc(18px * var(--text-skala, 1))/1.3 var(--fh); }
.erfolg-mini { width: 30px; height: 30px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid var(--gut); box-sizing: border-box; }
@keyframes erfolg-auf { 0% { opacity: 0; transform: scale(.92); } 60% { opacity: 1; transform: scale(1.02); } 100% { transform: none; } }
.wechsel-banner, .wechsel-banner.auftritt { position: absolute; z-index: 6; top: 8px; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); height: 96px; border-radius: var(--r); overflow: hidden; background: var(--nacht); border: 2px solid var(--ac); box-shadow: 0 8px 24px rgba(0,0,0,.35); pointer-events: none; animation: wechsel-banner var(--dauer, 2600ms) ease-in-out both; }
.wechsel-text { position: absolute; left: 12px; right: 12px; bottom: 8px; display: flex; flex-direction: column; gap: 1px; color: var(--auf-bild); }
.wechsel-text .eyebrow { color: var(--glanz); }
.wechsel-text .klein { color: var(--auf-bild); opacity: .9; }
.wechsel-name { font: 800 calc(22px * var(--text-skala, 1))/1.1 var(--fh); }
@keyframes wechsel-banner { 0% { opacity: 0; transform: translateY(-12px); } 12% { opacity: 1; transform: none; } 82% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
/* Version 50: „Neu für dich“ und verkleinerbares Premium */
.neu-karte { border-color: var(--ac); gap: 8px; }
.neu-zeile { display: flex; align-items: center; gap: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.neu-zeile .spalte { flex: 1; }
.neu-zeile .btn { flex: none; padding: 0 12px; }
.neu-ic { width: 38px; height: 38px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--sel); color: var(--ac); }
.neu-ok { align-self: flex-start; }
.tab-neu { position: absolute; top: -3px; right: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--ac); border: 2px solid var(--panel); }
.neu-tab .tab-nm { color: var(--ac); }
.stern-mini { width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--glanz); color: var(--auf-glanz); display: flex; align-items: center; justify-content: center; }
.stern-mini .ic { width: 14px; height: 14px; }
.spalte-zeile { display: flex; align-items: center; gap: 8px; }
.klapp-rahmen .karte.premium { padding-right: 90px; }
/* Einklappbare Abschnitte (Version 52) */
.klapp-rahmen { position: relative; display: flex; flex-direction: column; }
.klapp-zeile { flex-direction: row; align-items: center; gap: 10px; padding: 10px 14px; }
.klapp-zeile .spalte { flex: 1; gap: 2px; }
.klapp-mehr { flex: none; font: italic 500 calc(14px * var(--text-skala, 1)) var(--fi); color: var(--mute); text-decoration: underline; }
.story-ruhig { flex-direction: row; align-items: center; gap: 12px; padding: 10px 14px; }
.story-ruhig .spalte { flex: 1; gap: 2px; }
.story-ruhig > .ic { width: 26px; height: 26px; flex: none; color: var(--ac); }
.test-fehler { border-color: #B0205F; border-width: 2px; }
/* Version 58: ein „Kleiner“-Knopf für alle verkleinerbaren Karten (Hauptquest, Premium, Heldenmoment):
   kleine Pille oben rechts IN der Karte. auf-bild = über einem Foto (dunkel, durchscheinend). */
.klein-knopf { position: absolute; top: 8px; right: 8px; z-index: 2; min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--panel); color: var(--mute); font: 700 calc(13px * var(--text-skala, 1)) var(--fb); cursor: pointer; }
.klein-knopf::after { content: ' ▴'; font-size: calc(11px * var(--text-skala, 1)); }
.klein-knopf.auf-bild { border-color: var(--auf-bild); background: rgba(var(--schleier),.55); color: var(--auf-bild); }
.klein-knopf:active { transform: translateY(1px); }
.klapp-rahmen .karte { padding-right: 16px; }
.klapp-rahmen .quest-zeile { margin-top: 6px; }
/* Neues Abenteuer (Version 58): wie Siegel und Botschaft hervorgehoben, Glanz einmal je Angebot */
.karte.angebot { border-style: solid; border-width: 3px; border-color: var(--ac); box-shadow: 0 3px 0 var(--ac-dunkel), 0 0 0 4px rgba(var(--glanz-rgb),.28); }
.angebot-kopf { display: flex; align-items: center; gap: 10px; }
.glanz-stern .stern-klein { animation: glanz-siegel 1.1s ease-in-out 3; }
.karte.angebot, .karte.welten-karte { border-style: solid; border-width: 3px; border-color: var(--ac); box-shadow: 0 3px 0 var(--ac-dunkel), 0 0 0 4px rgba(var(--glanz-rgb),.28); }
/* Neuer Gegner (Version 59): Duell-Karte rüttelt zweimal kurz, einmal je Gegner */
.glanz-kampf { animation: wackel .5s ease 2; }
/* Version 57: Neues hervorheben ohne Rot. Siegel golden (Neugier statt Pflicht), ungelesene Botschaft als Sprechblase.
   Bewegung nur beim ersten Erscheinen (Klassen glanz-*, gesetzt von glanzNachZeichnen), nie dauernd. */
.story-neu { border-width: 3px; box-shadow: 0 3px 0 var(--ac-dunkel), 0 0 0 4px rgba(var(--glanz-rgb),.28); }
.story-neu .siegel-mark { width: 52px; height: 52px; background: radial-gradient(circle at 35% 30%, var(--wachs-hell) 0%, var(--wachs-mitte) 55%, var(--wachs-dunkel) 100%); color: var(--auf-wachs); box-shadow: 0 0 0 3px rgba(var(--glanz-rgb),.4), inset 0 -2px 0 rgba(0,0,0,.18); }
.story-karte.story-neu .siegel-mark .ic { color: var(--auf-wachs); width: 28px; height: 28px; }
.glanz-siegel .siegel-mark { animation: glanz-siegel 1.1s ease-in-out 3; }
@keyframes glanz-siegel { 0%, 100% { transform: none; box-shadow: 0 0 0 3px rgba(var(--glanz-rgb),.4); } 50% { transform: scale(1.1) rotate(-6deg); box-shadow: 0 0 0 6px rgba(var(--glanz-rgb),.25), 0 0 22px 8px rgba(var(--glanz-rgb),.75); } }
.botschaft-klein.botschaft-neu { gap: 10px; min-height: 52px; padding: 6px 12px 6px 6px; border: 2px solid var(--ac); border-radius: 6px 24px 24px 24px; background: var(--sel); color: var(--ink); font: 600 calc(15px * var(--text-skala, 1))/1.3 var(--fb); box-shadow: 0 2px 0 var(--ac-dunkel); align-self: stretch; text-align: left; }
.botschaft-klein.botschaft-neu span:not(.neu) { flex: 1; }
.botschaft-klein.botschaft-neu .rund-klein { width: 42px; height: 42px; border: 2px solid var(--ac); box-sizing: border-box; }
.botschaft-klein.botschaft-neu .neu { flex: none; font: 700 calc(11px * var(--text-skala, 1)) var(--fh); text-transform: uppercase; }
.glanz-wippen .rund-klein, .glanz-wippen > .rund { animation: glanz-wippen .9s ease-in-out 2; transform-origin: 50% 90%; }
@keyframes glanz-wippen { 0%, 100% { transform: none; } 20% { transform: translateY(-4px) rotate(-8deg); } 45% { transform: translateY(0) rotate(6deg); } 70% { transform: translateY(-2px) rotate(-3deg); } }
.sr-titel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.start-fuss .version { display: block; margin-top: 6px; font: 600 calc(12px * var(--text-skala, 1)) var(--fb); font-style: normal; letter-spacing: .04em; color: var(--mute); opacity: .8; }


/* Heldenkopf und „Helden wechseln“ (Version 43), neues Abenteuer */
.heldenkopf { display: flex; align-items: center; gap: 12px; }
.kopf-bild { width: 68px; height: 68px; flex: none; border-radius: 50%; object-fit: cover; border: 3px solid var(--ac); box-sizing: border-box; }
.kopf-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.kopf-name { font: 800 calc(22px * var(--text-skala, 1))/1.15 var(--fh); color: var(--ink); overflow-wrap: anywhere; }
.wechsel-knopf { flex: none; min-height: 48px; display: flex; align-items: center; gap: 6px; padding: 6px 10px 6px 8px; border-radius: 24px; border: 2px solid var(--edge); background: var(--panel); color: var(--ink); box-shadow: 0 2px 0 var(--line); cursor: pointer; }
.wechsel-knopf .ic { width: 16px; height: 16px; stroke-width: 2.6; color: var(--mute); }
.stapel { display: flex; }
.stapel-bild { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid var(--panel); box-sizing: border-box; }
.stapel-bild + .stapel-bild { margin-left: -10px; }
.offen-zahl { min-width: 20px; padding: 1px 6px; box-sizing: border-box; border-radius: 10px; background: var(--ac); color: var(--auf-ac); font: 700 calc(13px * var(--text-skala, 1)) var(--fh); text-align: center; }
.wahl-zeile { display: flex; align-items: center; gap: 8px; border-radius: 12px; }
.wahl-zeile.an { background: var(--sel); }
.wahl-info { flex: 1; min-width: 0; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 6px 8px; border: 0; border-radius: 12px; background: none; color: var(--ink); text-align: left; cursor: pointer; font: inherit; }
.wahl-info .spalte { flex: 1; min-width: 0; }
.wahl-bild { width: 48px; height: 48px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid var(--line); box-sizing: border-box; }
.wahl-zeile.an .wahl-bild { border-color: var(--ac); }
.wahl-status { flex: none; font: 700 calc(13px * var(--text-skala, 1)) var(--fh); }
.offen-text { color: var(--gegner); }
.akzent-text { color: var(--ac); }
.schnell { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 2px solid var(--ac); background: var(--panel); color: var(--ac); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.schnell .ic { width: 22px; height: 22px; stroke-width: 3; }
/* Heutige Heldentat (Version 44): Kontrastkarte in den Farben des Stils (Grund = Schrift, Schrift = Grund) */
/* Heutige Heldentat, Version 61: Variante A „Auftragskarte“ (Entscheidung 29.10.2026).
   Grundgerüst über Variablen (--tat-*), daraus je Welt ein eigener Rahmen. Welten ohne eigenen Rahmen nutzen die Stil-Farben. */
.heldentat { --tat-bg: var(--card); --tat-ink: var(--ink); --tat-rand: var(--ac); --tat-akzent: var(--ac); --tat-auf-akzent: var(--auf-ac); --tat-akzent-dunkel: var(--ac-dunkel);
  --tat-wenn: var(--gegner); --tat-dann: var(--gut-text); --tat-feld: var(--tief); --tat-linie: var(--line); --tat-leise: var(--soft);
  position: relative; background: var(--tat-bg); color: var(--tat-ink); border: 2px solid var(--tat-rand); box-shadow: 0 3px 0 var(--tat-akzent-dunkel); gap: 12px; padding: 18px 16px; }
.heldentat .eyebrow.tat-eyebrow { color: var(--tat-ink); opacity: .75; }
.tat-kopf { display: flex; align-items: center; gap: 12px; }
.tat-kopf .spalte { flex: 1; gap: 2px; }
.tat-medaille { width: 50px; height: 50px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--tat-feld); border: 2px solid var(--tat-akzent); color: var(--tat-akzent); }
.tat-medaille .ic { width: 26px; height: 26px; }
.tat-held { width: 46px; height: 46px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid var(--tat-akzent); box-sizing: border-box; }
.tat-name { padding: 0; border: 0; background: none; color: var(--tat-ink); font: 800 calc(26px * var(--text-skala, 1))/1.1 var(--fh); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.tat-wd { display: flex; flex-direction: column; gap: 2px; }
.tat-feld { margin: 0; padding: 9px 12px; border-radius: var(--r); background: var(--tat-feld); border: 1px solid var(--tat-linie); border-left: 4px solid var(--tat-wenn); font: 500 calc(16px * var(--text-skala, 1))/1.35 var(--fb); }
.tat-feld.dann { border-left-color: var(--tat-dann); }
.tat-feld b { display: block; font: 800 calc(11px * var(--text-skala, 1)) var(--fh); letter-spacing: .14em; color: var(--tat-wenn); margin-bottom: 2px; }
.tat-feld.dann b { color: var(--tat-dann); }
.tat-pfeil { align-self: center; color: var(--tat-leise); font-size: calc(16px * var(--text-skala, 1)); line-height: 1; }
.tat-frage { margin: 0; font: 700 calc(17px * var(--text-skala, 1))/1.35 var(--fb); }
.tat-knoepfe { display: flex; flex-direction: column; gap: 8px; }
.heldentat .btn.tat-ja { min-height: 58px; font-size: calc(17px * var(--text-skala, 1)); display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--tat-akzent); color: var(--tat-auf-akzent); border-color: var(--tat-akzent-dunkel); box-shadow: 0 3px 0 var(--tat-akzent-dunkel); }
.heldentat .btn.tat-ja .ic { width: 20px; height: 20px; stroke-width: 3; }
.heldentat .btn.tat-nein, .heldentat .btn.tat-schwer { min-height: 46px; font-size: calc(14px * var(--text-skala, 1)); background: transparent; color: var(--tat-leise); border: 1.5px solid var(--tat-linie); box-shadow: none; }
.heldentat .erledigt { background: var(--panel); }
.tat-marke { position: absolute; top: -9px; left: 14px; padding: 0 6px; background: var(--bg); color: var(--tat-akzent); font: 700 calc(10px * var(--text-skala, 1)) var(--fh); letter-spacing: .2em; }
/* Fantasy: Schriftrolle */
:root[data-stil="fantasy"] .heldentat, :root:not([data-stil]) .heldentat { --tat-bg: linear-gradient(180deg, #F7EACB 0%, #EED9A8 100%); --tat-ink: #2E2114; --tat-rand: #8B6A3A; --tat-akzent: #8B2E1F; --tat-auf-akzent: #F6EACB; --tat-akzent-dunkel: #5E1D13;
  --tat-wenn: #8B2E1F; --tat-dann: #2F6A3F; --tat-feld: rgba(139,46,31,.06); --tat-linie: #C9A467; --tat-leise: #4E3D28;
  border-radius: 6px; margin: 8px 0; box-shadow: inset 0 0 0 4px #F7EACB, inset 0 0 0 5px #B48E55, 0 4px 0 #8B6A3A; }
:root[data-stil="fantasy"] .heldentat::before, :root[data-stil="fantasy"] .heldentat::after { content: ""; position: absolute; left: -6px; right: -6px; height: 12px; background: linear-gradient(180deg, #C9A467, #8B6A3A); border-radius: 6px; pointer-events: none; }
:root[data-stil="fantasy"] .heldentat::before { top: -8px; }
:root[data-stil="fantasy"] .heldentat::after { bottom: -8px; }
:root[data-stil="fantasy"] .tat-medaille { background: radial-gradient(circle at 35% 30%, #F8E39B, #C99A2E 70%, #8E6A1C); color: #3A2508; border: 0; box-shadow: 0 0 0 3px #F7EACB, 0 0 0 4px #A97A1E; }
:root[data-stil="fantasy"] .tat-feld.dann { background: rgba(63,125,78,.1); }
/* Sci-Fi: Missionsterminal */
:root[data-stil="scifi"] .heldentat { --tat-bg: #071523; --tat-ink: #E6F7FF; --tat-rand: #19D3F3; --tat-akzent: #19D3F3; --tat-auf-akzent: #04121C; --tat-akzent-dunkel: #0E8BA3;
  --tat-wenn: #FF5C7A; --tat-dann: #3DF2A5; --tat-feld: #0F2236; --tat-linie: #1F4560; --tat-leise: #B5D3E3;
  border-width: 1px; margin-top: 8px; box-shadow: 0 0 18px rgba(25,211,243,.25), inset 0 0 30px rgba(25,211,243,.06);
  background-image: linear-gradient(rgba(25,211,243,.05) 1px, transparent 1px); background-size: 100% 4px; background-color: #071523; }
:root[data-stil="scifi"] .heldentat .eyebrow.tat-eyebrow { color: #19D3F3; opacity: 1; }
:root[data-stil="scifi"] .tat-medaille, :root[data-stil="scifi"] .tat-held { border-radius: 8px; box-shadow: 0 0 10px rgba(25,211,243,.45); }
:root[data-stil="scifi"] .tat-feld { border-top: 0; border-right: 0; border-bottom: 0; }
:root[data-stil="scifi"] .heldentat .btn.tat-ja { border: 0; box-shadow: 0 0 16px rgba(25,211,243,.6); }
/* Miami Nights: Neon */
:root[data-stil="strasse"] .heldentat { --tat-bg: linear-gradient(160deg, #2A0F45, #14061F); --tat-ink: #FFFFFF; --tat-rand: #FF7A2A; --tat-akzent: #FF7A2A; --tat-auf-akzent: #14061F; --tat-akzent-dunkel: #B34A0E;
  --tat-wenn: #FF4D6D; --tat-dann: #7DFF9A; --tat-feld: rgba(255,255,255,.05); --tat-linie: #4A2470; --tat-leise: #E6D6F5;
  box-shadow: 0 0 0 1px #FF4D6D inset, 0 0 22px rgba(255,122,42,.45); }
:root[data-stil="strasse"] .heldentat .eyebrow.tat-eyebrow { color: #FFD24A; opacity: 1; }
:root[data-stil="strasse"] .tat-name { text-shadow: 0 0 12px rgba(255,122,42,.8); letter-spacing: .04em; }
:root[data-stil="strasse"] .tat-medaille { border-radius: 0; background: #14061F; border-color: #FFD24A; color: #FFD24A; box-shadow: 0 0 12px rgba(255,210,74,.6); }
:root[data-stil="strasse"] .tat-held { border-radius: 0; border-color: #FF4D6D; }
:root[data-stil="strasse"] .heldentat .btn.tat-ja { border: 0; border-radius: 0; box-shadow: 0 0 18px rgba(255,122,42,.7); }
:root[data-stil="strasse"] .heldentat .btn.tat-nein, :root[data-stil="strasse"] .heldentat .btn.tat-schwer { border-radius: 0; }
/* Rom: Tagesbefehl auf Legionsrot, Knopf in Lorbeer-Gold */
:root[data-stil="rom"] .heldentat { --tat-bg: #8E1F1F; --tat-ink: #F7F2EA; --tat-rand: #C9A24A; --tat-akzent: #D4AF5A; --tat-auf-akzent: #3A1A08; --tat-akzent-dunkel: #8C6A22;
  --tat-wenn: #F2C9A0; --tat-dann: #D5E6BF; --tat-feld: rgba(255,255,255,.07); --tat-linie: #B5433B; --tat-leise: #F0D9D0;
  border-width: 2px; border-radius: 2px; margin: 8px 0; box-shadow: inset 0 0 0 4px #8E1F1F, inset 0 0 0 5px rgba(212,175,90,.55), 0 3px 0 #5E1212; }
:root[data-stil="rom"] .heldentat .eyebrow.tat-eyebrow { color: #E6C770; opacity: 1; }
:root[data-stil="rom"] .tat-marke { color: #8E1F1F; }
:root[data-stil="rom"] .tat-medaille { background: radial-gradient(circle at 35% 30%, #F3DE9C, #C9A24A 70%, #8C6A22); color: #3A1A08; border: 0; box-shadow: 0 0 0 3px #8E1F1F, 0 0 0 4px #D4AF5A; }

   nur Token-Werte und Rahmen. Vorher fielen sie auf die Grundfarben zurück. */
/* Mythologie: Marmortafel mit Goldlinie, Handlung in Ägäisblau */
:root[data-stil="myth"] .heldentat { --tat-bg: linear-gradient(180deg, #FFFFFF 0%, #F1ECDF 100%); --tat-ink: #1E2430; --tat-rand: #B88A2E; --tat-akzent: #1F4E79; --tat-auf-akzent: #F7F4EC; --tat-akzent-dunkel: #143552;
  --tat-wenn: #A63D2F; --tat-dann: #2F6B4F; --tat-feld: rgba(31,78,121,.06); --tat-linie: #D8CFB8; --tat-leise: #3B4252;
  border-width: 1px; border-radius: 2px; margin: 8px 0; box-shadow: inset 0 0 0 4px #FBF9F3, inset 0 0 0 5px rgba(184,138,46,.55), 0 3px 0 #8C6A22; }
:root[data-stil="myth"] .heldentat .eyebrow.tat-eyebrow { color: #8C6A22; opacity: 1; }
:root[data-stil="myth"] .tat-medaille { background: radial-gradient(circle at 35% 30%, #F3DE9C, #D4AF5A 70%, #8C6A22); color: #1E2430; border: 0; box-shadow: 0 0 0 3px #FBF9F3, 0 0 0 4px #B88A2E; }

:root[data-stil="myth"] .heldentat .btn.tat-ja, :root[data-stil="myth"] .heldentat .btn.tat-nein, :root[data-stil="myth"] .heldentat .btn.tat-schwer { border-radius: 2px; }
/* Cozy: genähte Rezeptkarte, Handlung in Terrakotta, Ränder in Salbei */

  --tat-wenn: #8A3F22; --tat-dann: #4A7339; --tat-feld: rgba(157,176,138,.14); --tat-linie: #E3D6BE; --tat-leise: #4F4636;
  border-radius: 18px; margin: 8px 0; box-shadow: inset 0 0 0 3px #FFFDF8, inset 0 0 0 4px rgba(157,176,138,.45), 0 3px 0 #E3D6BE; }
:root[data-stil="cozy"] .heldentat .eyebrow.tat-eyebrow { color: #4F7B3D; opacity: 1; }
