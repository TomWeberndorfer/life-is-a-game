<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Life is a Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=EB+Garamond:wght@500;600;700&family=Alegreya:ital,wght@1,500&family=Orbitron:wght@600;700&family=Exo+2:wght@400;600;700&family=Marcellus&family=Cormorant+Garamond:wght@500;700&family=Fredoka:wght@500;600&family=Nunito:wght@400;700&family=Pixelify+Sans:wght@400;600;700&family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
/* Layout: eine Spalte wie eine Handy-App, max. 480px, Bildschirme mit festem Fuß für die Hauptaktion.
   Jeder Stil ist eine bewusst gewählte eigene Welt (je ein festes Farbschema statt Hell/Dunkel). */
:root, :root[data-stil="fantasy"] {
  color-scheme: light;
  --bg: #E6D3A6; --bg-verlauf: radial-gradient(ellipse at 50% 0%, #F6EACB 0%, #E6D3A6 65%, #D8C08C 100%);
  --panel: #FBF3DC; --card: #FBF3DC; --tief: #F3E6C4;
  --ink: #2E2114; --soft: #4E3D28; --mute: #5A4A33;
  --line: #C9B27C; --edge: #A8895A;
  --ac: #8B2E1F; --ac-dunkel: #5E1D13; --auf-ac: #F6EACB; --sel: #F6E2C8;
  --gut: #3F7D4E; --auf-gut: #FBF3DC; --gut-text: #2F6A3F;
  --gegner: #B5472F; --auf-gegner: #FBF3DC;
  --nacht: #2A1E13; --nacht-verlauf: radial-gradient(ellipse at 50% 20%, #4A3320 0%, #2A1E13 70%); --nacht-ink: #F6EACB; --nacht-soft: #E8D9B5;
  --fh: 'Cinzel', Georgia, serif; --fb: 'EB Garamond', Georgia, serif; --fi: 'Alegreya', Georgia, serif;
  --r: 6px; --r-cta: 28px; --schatten: 0 3px 0 var(--line);
}
:root[data-stil="scifi"] {
  color-scheme: dark;
  --bg: #0A1828; --bg-verlauf: radial-gradient(ellipse at 50% 0%, #12304A 0%, #0A1424 60%, #060B16 100%);
  --panel: #0F2236; --card: #0F2236; --tief: #0A1828;
  --ink: #E6F7FF; --soft: #B5D3E3; --mute: #8FB2C6;
  --line: #1F4560; --edge: #2BB8D6;
  --ac: #19D3F3; --ac-dunkel: #0E8BA3; --auf-ac: #04121C; --sel: #123A55;
  --gut: #3DF2A5; --auf-gut: #04121C; --gut-text: #3DF2A5;
  --gegner: #FF5C7A; --auf-gegner: #1A0610;
  --nacht: #060B16; --nacht-verlauf: radial-gradient(ellipse at 50% 20%, #1A1030 0%, #060B16 70%); --nacht-ink: #E6F7FF; --nacht-soft: #B5D3E3;
  --fh: 'Orbitron', system-ui, sans-serif; --fb: 'Exo 2', system-ui, sans-serif; --fi: 'Exo 2', system-ui, sans-serif;
  --r: 6px; --r-cta: 8px; --schatten: 0 0 0 1px rgba(25,211,243,.25), 0 0 14px rgba(25,211,243,.18);
}
:root[data-stil="myth"] {
  color-scheme: light;
  --bg: #F7F4EC; --bg-verlauf: linear-gradient(180deg, #F7F4EC 0%, #EEE8DA 100%);
  --panel: #FFFFFF; --card: #FBF9F3; --tief: #F1ECDF;
  --ink: #1E2430; --soft: #3B4252; --mute: #5A6172;
  --line: #D8CFB8; --edge: #B88A2E;
  --ac: #1F4E79; --ac-dunkel: #143552; --auf-ac: #F7F4EC; --sel: #E4ECF4;
  --gut: #2F6B4F; --auf-gut: #F7F4EC; --gut-text: #2F6B4F;
  --gegner: #A63D2F; --auf-gegner: #F7F4EC;
  --nacht: #1B2333; --nacht-verlauf: radial-gradient(ellipse at 50% 20%, #2C3A55 0%, #1B2333 70%); --nacht-ink: #F7F4EC; --nacht-soft: #D9D2BF;
  --fh: 'Marcellus', Georgia, serif; --fb: 'Cormorant Garamond', Georgia, serif; --fi: 'Cormorant Garamond', Georgia, serif;
  --r: 2px; --r-cta: 2px; --schatten: 0 3px 0 var(--line);
}
:root[data-stil="cozy"] {
  color-scheme: light;
  --bg: #F3EBDC; --bg-verlauf: linear-gradient(180deg, #F7F0E3 0%, #EFE4CF 100%);
  --panel: #FFFDF8; --card: #FFF8EE; --tief: #F3EBDC;
  --ink: #3A3226; --soft: #4F4636; --mute: #665D4D;
  --line: #E3D6BE; --edge: #9DB08A;
  --ac: #B4552F; --ac-dunkel: #8A3F22; --auf-ac: #FFF8EE; --sel: #F7E3D6;
  --gut: #4F7B3D; --auf-gut: #FFF8EE; --gut-text: #4A7339;
  --gegner: #6B7A8F; --auf-gegner: #FFF8EE;
  --nacht: #3E4A3A; --nacht-verlauf: radial-gradient(ellipse at 50% 20%, #56664F 0%, #3E4A3A 70%); --nacht-ink: #FFF8EE; --nacht-soft: #E5E0CC;
  --fh: 'Fredoka', 'Nunito', sans-serif; --fb: 'Nunito', system-ui, sans-serif; --fi: 'Nunito', system-ui, sans-serif;
  --r: 18px; --r-cta: 26px; --schatten: 0 3px 0 var(--line);
}
:root[data-stil="monster"] {
  color-scheme: light;
  --bg: #D8E8B0; --bg-verlauf: linear-gradient(180deg, #E2EFC0 0%, #D8E8B0 100%);
  --panel: #F6FBE6; --card: #F6FBE6; --tief: #EAF3C8;
  --ink: #1D2B12; --soft: #34471C; --mute: #46592A;
  --line: #8FA860; --edge: #1D2B12;
  --ac: #C0392B; --ac-dunkel: #7E241B; --auf-ac: #FFFFFF; --sel: #FBE3DF;
  --gut: #2F7A2B; --auf-gut: #FFFFFF; --gut-text: #2B6E27;
  --gegner: #7B3FA0; --auf-gegner: #FFFFFF;
  --nacht: #1D2B12; --nacht-verlauf: radial-gradient(ellipse at 50% 20%, #34471C 0%, #1D2B12 70%); --nacht-ink: #F6FBE6; --nacht-soft: #D8E8B0;
  --fh: 'Pixelify Sans', monospace; --fb: 'Pixelify Sans', monospace; --fi: 'Pixelify Sans', monospace;
  --r: 2px; --r-cta: 2px; --schatten: 0 3px 0 var(--edge);
}

:root[data-stil="strasse"] {
  color-scheme: dark;
  --bg: #14061F; --bg-verlauf: linear-gradient(180deg, #2A0F45 0%, #14061F 55%, #0C0314 100%);
  --panel: #1B0A2C; --card: #25103A; --tief: #1B0A2C;
  --ink: #FFFFFF; --soft: #E6D6F5; --mute: #C4A8DA;
  --line: #4A2470; --edge: #FFD24A;
  --ac: #FF7A2A; --ac-dunkel: #B34A0E; --auf-ac: #14061F; --sel: #3A1658;
  --gut: #7DFF9A; --auf-gut: #14061F; --gut-text: #7DFF9A;
  --gegner: #FF4D6D; --auf-gegner: #14061F;
  --nacht: #0C0314; --nacht-verlauf: radial-gradient(ellipse at 50% 20%, #3A1658 0%, #0C0314 70%); --nacht-ink: #FFFFFF; --nacht-soft: #E6D6F5;
  --fh: 'Bebas Neue', Impact, sans-serif; --fb: 'Barlow Condensed', 'Arial Narrow', sans-serif; --fi: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --r: 0px; --r-cta: 0px; --schatten: 0 0 0 1px rgba(255,122,42,.35), 0 0 16px rgba(255,122,42,.2);
}
:root[data-stil="strasse"] h1, :root[data-stil="strasse"] .nm, :root[data-stil="strasse"] .questtitel { letter-spacing: .03em; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--fb); font-size: 17px; }
#app { position: relative; max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-verlauf); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
.ic { width: 22px; height: 22px; flex: none; }
.ic.gross { width: 54px; height: 54px; stroke-width: 1.7; }

.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
.screen.dunkel { background: var(--nacht-verlauf); color: var(--nacht-ink); --soft: var(--nacht-soft); --mute: var(--nacht-soft); }
.inhalt { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-block: 12px 4px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.inhalt.mitte { align-items: center; text-align: center; justify-content: flex-start; padding-top: 28px; }
.inhalt.hoch { margin-top: -44px; position: relative; }
.fuss { flex: none; display: flex; flex-direction: column; gap: 8px; padding-block: 14px 24px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

h1 { margin: 0; font: 700 25px/1.2 var(--fh); text-wrap: balance; }
h1.mittel { font-size: 22px; line-height: 1.28; }
h1.name { font-size: 30px; font-weight: 800; }
.lead { margin: 0; font-size: 17px; line-height: 1.4; color: var(--soft); }
.frage { margin: 4px 0 0; font-weight: 700; font-size: 19px; }
.rolle { margin: 0; font: italic 500 18px var(--fi); color: var(--soft); }
.stark { margin: 4px 0 0; font-weight: 700; font-size: 18px; }
.klein { font-size: 15px; line-height: 1.35; color: var(--mute); margin: 0; }
.mitte-text { text-align: center; }
.eyebrow { font: 700 12px var(--fh); letter-spacing: .12em; color: var(--mute); margin: 0; }
.eyebrow.akzent { color: var(--ac); }
.gut-text { color: var(--gut-text); }

/* Onboarding-Kopf */
.ob-kopf { flex: none; display: flex; align-items: center; gap: 8px; min-height: 60px; padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ob-kopf.ueber { position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
.ob-kopf.hell { color: #FBF3DC; }
.icbtn, .icplatz { width: 44px; height: 44px; flex: none; }
.icbtn { border: 0; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 50%; color: inherit; }
.einst-btn { background: var(--panel); border: 1.5px solid var(--edge); box-shadow: 0 2px 0 var(--line); color: var(--ink); }
.einst-btn .ic { width: 26px; height: 26px; stroke-width: 1.9; }
.einst-btn:active { transform: translateY(1px); box-shadow: none; }
.prog { flex: 1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.prog i { height: 6px; border-radius: 3px; background: var(--line); }
.prog i.on { background: var(--ac); }
.ob-kopf.hell .prog i { background: rgba(251,243,220,.45); }
.ob-kopf.hell .prog i.on { background: #FBF3DC; }
.screen.dunkel .prog i.on { background: var(--gegner); }
.schritt { font: 700 12px var(--fh); }

.ob-bild { position: relative; flex: none; overflow: hidden; }
.ob-bild.klein { height: 170px; }
.ob-bild.mittel { height: 210px; }
.ob-bild.gross { height: 360px; }
.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.verlauf { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, var(--bg) 100%); }
.verlauf.dunkel-oben { background: linear-gradient(180deg, rgba(20,14,8,.5) 0%, transparent 25%, transparent 55%, var(--bg) 100%); }

/* Auswahl */
.optionen { display: flex; flex-direction: column; gap: 8px; }
.opt { min-height: 56px; width: 100%; text-align: left; padding: 8px 16px; border-radius: var(--r); border: 2px solid var(--line); background: var(--card); box-shadow: var(--schatten); font-size: 18px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 12px; cursor: pointer; }
.opt .ic { color: var(--mute); }
.opt.sel { border-color: var(--ac); background: var(--sel); box-shadow: 0 3px 0 var(--ac-dunkel); }
.opt.sel .ic { color: var(--ac); }
.opt.leise { font-style: italic; color: var(--soft); }
.chip { align-self: flex-start; padding: 4px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font: 700 12px var(--fh); letter-spacing: .08em; color: var(--ac); }
.chip.gut { background: var(--gut); color: var(--auf-gut); border-color: var(--gut); }
.chip.schlecht { background: var(--gegner); color: var(--auf-gegner); border-color: var(--gegner); }
.inhalt.mitte .chip { align-self: center; }
.feld { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 15px; color: var(--mute); }
.feld input { min-height: 52px; box-sizing: border-box; width: 100%; border-radius: var(--r); border: 2px solid var(--line); background: var(--panel); color: var(--ink); padding: 0 14px; font: 500 17px var(--fb); }
.notiz { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r); background: var(--tief); border: 1px dashed var(--edge); }
.notiz p { margin: 0; font: italic 500 16px/1.4 var(--fi); color: var(--soft); }

.cta { min-height: 56px; width: 100%; border-radius: var(--r-cta); border: 2px solid var(--ac-dunkel); background: var(--ac); color: var(--auf-ac); box-shadow: 0 3px 0 var(--ac-dunkel); font: 800 16px var(--fh); letter-spacing: .02em; cursor: pointer; }
.cta.rot { background: var(--gegner); color: var(--auf-gegner); border-color: var(--ac-dunkel); }
.cta:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.cta:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ac-dunkel); }
.link { min-height: 44px; border: 0; background: none; color: inherit; font: italic 500 16px var(--fi); text-decoration: underline; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.btn { min-height: 52px; padding: 0 12px; border-radius: var(--r-cta); border: 2px solid var(--edge); background: var(--panel); color: var(--ink); box-shadow: 0 3px 0 var(--edge); font: 800 14px/1.2 var(--fh); cursor: pointer; }
.btn.voll { background: var(--ac); color: var(--auf-ac); border-color: var(--ac-dunkel); box-shadow: 0 3px 0 var(--ac-dunkel); }
.btn.warn { background: var(--gegner); color: var(--auf-gegner); border-color: var(--gegner); }
/* Einwilligung (Version 28) */
.btn.ja { background: var(--gut); color: var(--auf-gut); border-color: var(--gut); }
.einw-mehr summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
.einw-mehr p { margin-top: 4px; }
.einw-ok { display: flex; align-items: center; gap: 6px; color: var(--gut-text); }
.btn:active { transform: translateY(2px); box-shadow: none; }

/* Analyse */
.ring { position: relative; width: 190px; height: 190px; }
.ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: dreh 6s linear infinite; }
.ring.still > svg { animation: none; }
.ring .r1 { fill: none; stroke: var(--edge); stroke-width: 2; stroke-dasharray: 4 8; }
.ring .r2 { fill: none; stroke: var(--ac); stroke-width: 3; stroke-dasharray: 120 345; stroke-linecap: round; }
.ring > span { position: absolute; inset: 30px; border-radius: 50%; background: var(--panel); border: 2px solid var(--edge); display: flex; align-items: center; justify-content: center; color: var(--ac); }
@keyframes dreh { to { transform: rotate(360deg); } }
.analyse-liste { list-style: none; margin: 8px 0 0; padding: 0; align-self: stretch; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.analyse-liste li { display: flex; align-items: center; gap: 14px; min-height: 44px; font-size: 19px; color: var(--mute); }
.analyse-liste li.ok { color: var(--ink); }
.analyse-liste li.jetzt { color: var(--ink); font-weight: 700; }
.dot { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid var(--edge); box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
.dot .ic { width: 16px; height: 16px; stroke-width: 3.2; }
li.ok .dot { background: var(--gut); border-color: var(--gut); color: var(--auf-gut); }
li.jetzt .dot { background: var(--ac); border-color: var(--ac); animation: puls 1.2s ease-in-out infinite; }
@keyframes puls { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

/* Verbündeter, Gegner, Fähigkeit */
.haken { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.haken li { display: flex; gap: 10px; align-items: flex-start; font-size: 18px; line-height: 1.35; }
.haken .ic { color: var(--gut); stroke-width: 2.6; margin-top: 2px; width: 20px; height: 20px; }
.boss-bild { position: relative; height: 260px; border-radius: 8px; overflow: hidden; border: 2px solid var(--gegner); box-shadow: 0 0 0 4px rgba(181,71,47,.25); }
.kraft { display: flex; align-items: center; gap: 8px; font: 700 11px var(--fh); }
.balken { flex: 1; height: 10px; border-radius: 5px; overflow: hidden; background: var(--tief); border: 1px solid var(--edge); }
.balken i { display: block; height: 100%; background: var(--gut); transition: width .6s ease; }
.balken.boss i { background: var(--gegner); }
.balken.xp { height: 6px; margin-top: 4px; }
.balken.xp i { background: var(--ac); }
.zwei { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.box { min-width: 0; padding: 12px; border-radius: var(--r); display: flex; flex-direction: column; gap: 6px; font-size: 16px; line-height: 1.35; }
.box b { font: 700 12px var(--fh); letter-spacing: .06em; }
.box.schlecht { background: rgba(181,71,47,.2); border: 1px solid var(--gegner); }
.box.gut { background: rgba(63,125,78,.25); border: 1px solid var(--gut); }
.karte { background: var(--card); border: 2px solid var(--edge); border-radius: 8px; box-shadow: 0 3px 0 var(--edge); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.karte.faehigkeit { align-items: center; gap: 14px; padding: 22px 20px; }
.karte.faehigkeit .wenn { align-self: flex-start; margin: 0; font: italic 500 17px var(--fi); color: var(--soft); }
.karte.faehigkeit .haken { align-self: stretch; }
.medaille { width: 92px; height: 92px; border-radius: 50%; background: var(--tief); border: 2px solid var(--ac); color: var(--ac); display: flex; align-items: center; justify-content: center; flex: none; }
.medaille.klein-m { width: 44px; height: 44px; }
.gegen { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--r); background: var(--tief); border: 1px solid var(--line); font-size: 16px; line-height: 1.35; }
.rund { width: 44px; height: 44px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid var(--gegner); box-sizing: border-box; }
.siegel-reihe { display: flex; gap: 14px; justify-content: center; }
.siegel { width: 54px; height: 54px; border-radius: 50%; border: 2px dashed var(--edge); background: var(--tief); display: flex; align-items: center; justify-content: center; font: 800 18px var(--fh); color: var(--mute); flex: none; }
.siegel.voll { background: var(--ac); border: 2px solid var(--ac-dunkel); color: var(--auf-ac); }
.belohnung { list-style: none; margin: 0; padding: 0 4px; display: flex; flex-direction: column; gap: 10px; }
.belohnung li { display: flex; align-items: center; gap: 12px; font-size: 17px; }
.rund-ic { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.rund-ic.gut { background: var(--gut); color: var(--auf-gut); }

/* Startseite */
.start-kopf { flex: none; display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.datum { font: 700 15px var(--fh); color: var(--mute); }
.start-inhalt { gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.questtitel { font: 800 22px/1.2 var(--fh); text-wrap: balance; }
/* Quest bearbeiten (Version 38) */
.quest-zeile { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.qe-knopf { flex: none; min-height: 44px; font-size: 15px; color: var(--mute); margin-top: -10px; }
.qe-knopf .ic { width: 18px; height: 18px; }
.qe-anzahl .opt.kurz { flex: 1 0 40px; min-width: 40px; padding: 6px 0; }
.zeile { display: flex; align-items: center; gap: 10px; }
.mini { font: 700 12px var(--fh); }
.nm { font: 700 16px var(--fh); overflow-wrap: anywhere; }
.gross-nm { font-size: 18px; }
.segmente { display: flex; gap: 3px; margin-top: 2px; }
.segmente i { flex: 1; height: 8px; border-radius: 2px; background: var(--tief); border: 1px solid var(--gegner); transition: background .4s; }
.segmente i.voll { background: var(--gegner); }
.karte.besiegt .duell-bild { filter: grayscale(.85) brightness(.85); }
/* Duell-Karte (Version 45): breites Gegnerbild mit „Held vs Gegner“, darunter Lebensbalken */

/* Stilwahl */
.welten { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-self: stretch; }

.welt .welt-schloss { position: absolute; top: 8px; right: 8px; left: auto; bottom: auto; padding: 0; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: rgba(10,8,5,.7); color: #FBF3DC; }

.stern-gross .ic { width: 40px; height: 40px; }

/* Feier */
.feier { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); background: rgba(12,8,4,.72); }
.feier-karte { width: 100%; background: var(--panel); color: var(--ink); border: 2px solid var(--edge); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.4); }

/* Testprofil */
.testleiste { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 8px 4px 12px; background: #B0205F; color: #fff; font: 700 12px system-ui, sans-serif; letter-spacing: .06em; }
.tl-knoepfe { margin-left: auto; display: flex; gap: 6px; }

/* Etappe 2: tippbare Karten, Blätter, Bewertungen, Feedback, Premium, Admin */
.tippbar { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }

.feier.unten { align-items: flex-end; padding: 0; }
.hintergrund { position: absolute; inset: 0; border: 0; background: transparent; cursor: pointer; }
.blatt { position: relative; width: 100%; max-height: 92%; overflow-y: auto; background: var(--panel); color: var(--ink); border-top: 2px solid var(--edge); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.3); }

.griff { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
.skala { display: flex; justify-content: space-between; gap: 6px; }

.sc:active { background: var(--ac); color: var(--auf-ac); border-color: var(--ac-dunkel); }
.skala-text { display: flex; justify-content: space-between; font: italic 500 14px var(--fi); color: var(--mute); }
.karte.premium { flex-direction: row; align-items: center; gap: 12px; border-style: dashed; }
.stern-klein { width: 40px; height: 40px; flex: none; border-radius: 50%; background: #E9C46A; color: #2E2114; display: flex; align-items: center; justify-content: center; }

.feld textarea { box-sizing: border-box; width: 100%; min-height: 84px; border-radius: var(--r); border: 2px solid var(--line); background: var(--panel); color: var(--ink); padding: 10px 14px; font: 500 17px/1.4 var(--fb); resize: vertical; }

.feld select { min-height: 52px; box-sizing: border-box; width: 100%; border-radius: var(--r); border: 2px solid var(--line); background: var(--panel); color: var(--ink); padding: 0 10px; font: 500 17px var(--fb); }

.pf-v { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.pf-zeile .spalte { flex: 1; overflow-wrap: anywhere; }

.pf-knoepfe { display: flex; flex-direction: column; gap: 4px; flex: none; }
.pf-knoepfe .btn { min-height: 40px; padding: 0 10px; }
.pf-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.pf-medium { display: flex; align-items: flex-start; gap: 10px; min-width: 0; padding-top: 8px; border-top: 1px solid var(--line); }
.pf-medium .spalte { flex: 1; overflow-wrap: anywhere; }
.pf-mini.gross { width: 64px; height: 64px; }
.pf-unbenutzt { color: var(--ac); font-weight: 700; }
.pf-stilgruppe summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }
.pf-stilgruppe .pf-plaetze { padding-bottom: 8px; }
.pf-platz.q-eigen { border-color: var(--ac); }
.pf-hinweis { padding: 8px 12px; border-radius: var(--r); border: 1px solid var(--ac); background: var(--sel); }

.pf-hinweis .link { min-height: 36px; font-size: 15px; }
.pf-fehler { margin: 0; padding-left: 18px; color: var(--gegner); font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.admin .inhalt { gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.kacheln { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.kachel { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.zahl { font: 800 24px var(--fh); font-variant-numeric: tabular-nums; }

.bz { display: grid; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 3em; align-items: center; gap: 8px; font-size: 15px; }

/* Tägliche Inhalte: Crew-Botschaft, Geschichte, Mikroquests */
.botschaft { display: flex; gap: 10px; align-items: flex-start; }
.botschaft .rund { width: 52px; height: 52px; border-color: var(--gut); }
.blase { position: relative; flex: 1; min-width: 0; margin: 0; padding: 10px 14px; background: var(--panel); border: 2px solid var(--edge); border-radius: 4px 16px 16px 16px; font: italic 500 16px/1.4 var(--fi); color: var(--ink); }
.blase b { display: block; font: 700 12px var(--fh); letter-spacing: .08em; font-style: normal; color: var(--gut-text); margin-bottom: 2px; }
.story-karte { flex-direction: row; align-items: center; gap: 12px; }
.story-karte .spalte { flex: 1; }
.story-karte .ic { color: var(--ac); width: 28px; height: 28px; }
.neu { color: var(--auf-ac); background: var(--ac); padding: 1px 6px; border-radius: 8px; letter-spacing: .06em; }
.rechts-oben { margin-left: auto; color: var(--mute); }
.mikro { gap: 6px; }
.mikro-zeile { display: flex; align-items: center; gap: 12px; min-height: 48px; width: 100%; padding: 6px 4px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); text-align: left; font: 500 16px/1.3 var(--fb); cursor: pointer; }
.haken-kreis { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 2px solid var(--edge); display: flex; align-items: center; justify-content: center; }
.haken-kreis .ic { width: 16px; height: 16px; stroke-width: 3.2; }
.mikro-zeile.fertig .haken-kreis { background: var(--gut); border-color: var(--gut); color: var(--auf-gut); }
.mikro-zeile.fertig span:last-child { color: var(--mute); text-decoration: line-through; }
.teile { display: flex; flex-direction: column; gap: 16px; }
.teil { display: flex; flex-direction: column; gap: 4px; }
.teil h3 { margin: 0; font: 700 19px/1.3 var(--fh); }
.teil p { margin: 0; font-size: 18px; line-height: 1.55; max-width: 65ch; }
.teil.gesperrt h3 { color: var(--mute); }
.story-blatt { align-items: stretch; text-align: left; max-height: 86vh; overflow-y: auto; }
/* Story-Popup als Kapitelmoment (Version 40): Bild oben, Text erscheint kurz danach; ohne Bewegung bei „Bewegung reduzieren“ */
.story-moment { padding-top: 0; gap: 14px; }
.story-bild { position: relative; flex: none; height: 190px; margin: 0 -20px; overflow: hidden; border-radius: 8px 8px 0 0; background: var(--tief); }
.story-bild img { animation: story-nah 7s ease-out both; }
.story-bild-verlauf { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, var(--panel) 100%); }
.story-text { display: flex; flex-direction: column; gap: 8px; margin-top: -28px; position: relative; animation: story-auf .6s .25s ease-out both; }
.story-text h2 { text-align: left; }
.story-chip { align-self: flex-start; }
.story-absatz { font-size: 18px; line-height: 1.55; color: var(--ink) !important; max-width: 65ch; }
.story-folgt { font: italic 500 16px var(--fi); color: var(--mute) !important; }
@keyframes story-nah { from { transform: scale(1.08); } to { transform: scale(1); } }
@keyframes story-auf { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* Geheimnisvolle Story (Version 48): Siegel, eingeklappte Teile, Nebel, Satz für Satz */
.story-neu { border-color: var(--ac); }
.siegel-mark { width: 46px; height: 46px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--ac); color: var(--auf-ac); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 25%, transparent); }
.story-karte .siegel-mark .ic { width: 26px; height: 26px; color: var(--auf-ac); }
.story-andeutung { font: italic 500 16px/1.4 var(--fi); color: var(--ink); }
.story-hinweis { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 4px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--mute); text-align: left; font: 500 15px/1.35 var(--fb); cursor: pointer; }
.story-hinweis .ic { width: 20px; height: 20px; flex: none; color: var(--ac); }
.story-hinweis .klein { color: var(--mute); }
.teil.gelesen summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 44px; }
.teil.gelesen summary::-webkit-details-marker { display: none; }
.teil.gelesen summary h3::after { content: ' ▾'; color: var(--mute); font-size: 14px; }
.teil.gelesen[open] summary h3::after { content: ' ▴'; }
.teil.gelesen p { margin-top: 6px; }
.teil.versiegelt { padding: 12px 14px; border: 2px dashed var(--edge); border-radius: 12px; gap: 8px; }
.teil.frei-siegel { border-style: solid; border-color: var(--ac); }
.andeutung { margin: 0; font: italic 500 17px/1.45 var(--fi) !important; color: var(--ink); }
.siegel-knopf { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; }
.siegel-knopf .ic { width: 20px; height: 20px; }
.teil.nebel { position: relative; min-height: 64px; justify-content: center; align-items: center; border-radius: 12px; overflow: hidden; }
.nebel-schleier { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--mute) 22%, transparent), transparent); filter: blur(8px); }
.teil.nebel .klein { position: relative; font-style: italic; }
.teil.gebrochen summary { animation: siegel-bricht 520ms cubic-bezier(.2,.8,.3,1) both; }
.satz { opacity: 0; animation: story-auf .5s ease-out forwards; animation-delay: calc(300ms + var(--i, 0) * 650ms); }
@media (prefers-reduced-motion: reduce) { .satz { opacity: 1; } }
:root[data-bewegung="aus"] .satz { opacity: 1; animation: none; }
@keyframes siegel-bricht { 0% { transform: scale(.94); opacity: .4; filter: blur(2px); } 60% { transform: scale(1.02); opacity: 1; filter: none; } 100% { transform: none; } }
/* Momente der Startseite (Version 49): großes Heldenbild nach „Ja“, Banner beim Heldenwechsel */
.erfolg-bild { position: relative; margin: 0; height: 210px; border-radius: var(--r); overflow: hidden; background: var(--nacht); border: 2px solid var(--panel); }
