.siegel-rund .ic { position: relative; width: 32px; height: 32px; stroke-width: 2.3; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
.tat-siegel.treffer .siegel-rund { box-shadow: var(--siegel-treffer-schatten); color: var(--tat-auf-akzent); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--tat-akzent) 55%, #fff), var(--tat-akzent) 55%, var(--tat-akzent-dunkel)); }
/* Version 141: drittes Siegel „War schwer“ – ruhige Fläche mit Rand statt Farbe (kein Rot, kein Makel) */
.tat-siegel.schwer .siegel-rund { color: var(--tat-ink); background: var(--tat-feld); box-shadow: inset 0 0 0 2px var(--tat-linie, var(--line)); }
.tat-siegel.ruhe .siegel-rund { color: var(--auf-gut); background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--gut) 55%, #fff), var(--gut) 55%, color-mix(in srgb, var(--gut) 60%, #000)); }
.tat-siegel:hover .siegel-rund { transform: translateY(-2px); }
.tat-siegel:active .siegel-rund { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.15), inset 0 -2px 0 rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.3); }
.tat-siegel:focus-visible { outline: none; }
.tat-siegel:focus-visible .siegel-rund { outline: 3px solid var(--tat-akzent); outline-offset: 3px; }
/* Schritt „Zähler“ (31.10.2026): Stützgewohnheiten – leise Haken nach der Antwort, Liste in „Quest bearbeiten“ */
.stuetzen { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.stuetzen .eyebrow { color: var(--mute); }
.stuetze { display: flex; align-items: center; gap: 10px; min-height: 48px; width: 100%; padding: 6px 10px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.stuetze.an { border-color: var(--gut); }
.stuetze.wartet { cursor: default; color: var(--mute); border-style: dashed; }
.stuetze-haken { flex: 0 0 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid var(--line); color: var(--auf-gut); }
.stuetze.an .stuetze-haken { background: var(--gut); border-color: var(--gut); }
.stuetze-haken .ic { width: 16px; height: 16px; }
.stuetze-text { display: flex; flex-direction: column; min-width: 0; }
.stuetze-text span { font-weight: 700; overflow-wrap: anywhere; }
.stuetze-text small { color: var(--mute); font-size: calc(13px * var(--text-skala, 1)); }
.stuetze-bereit { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r); background: var(--tat-feld, var(--tief)); border: 1px solid var(--tat-linie, var(--line)); }
.stuetze-bereit .klein { flex: 1; min-width: 0; color: var(--tat-ink, var(--ink)); }
.stuetze-bereit .kachel-ic { color: var(--gut-text); }
/* Schnellleiste (Version 93): Nebenaktionen als Kacheln mit Symbol und kurzem Wort statt unterstrichener Links.
   Farben aus der Heldentat (--tat-*), sonst aus dem Stil; nie Rot. Rahmenform je Stil über --r und die Stil-Regeln unten. */
.schnell-leiste { align-self: stretch; display: grid; grid-template-columns: repeat(auto-fit, minmax(68px, 1fr)); gap: 6px; }
.aktion-kachel { min-width: 0; min-height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 8px 4px; border-radius: var(--r-kachel); box-shadow: var(--kachel-schatten); border: 1px solid var(--tat-linie, var(--line)); background: var(--tat-feld, var(--panel)); color: var(--tat-ink, var(--ink)); font: 600 calc(12px * var(--text-skala, 1))/1.15 var(--fb); text-align: center; cursor: pointer; transition: transform .12s ease, border-color .12s ease; }
.aktion-kachel:hover { border-color: var(--tat-akzent, var(--ac)); box-shadow: var(--kachel-schatten-hover); }
.aktion-kachel:active { transform: translateY(1px); }
.aktion-kachel.an { border-color: var(--tat-akzent, var(--ac)); }
.kachel-ic { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: var(--r-kachel-ic); box-shadow: var(--kachel-ic-schatten); background: var(--panel); border: 1px solid var(--tat-linie, var(--line)); color: var(--tat-akzent, var(--ac)); }
.kachel-ic .ic { width: 18px; height: 18px; }
.kachel-wort { max-width: 100%; overflow-wrap: anywhere; }
.aktion-kachel.notfall .kachel-ic { color: var(--gut-text); }
.rat-liste .schnell-leiste { margin-bottom: 2px; }
.lesen-knopf.leise { background: var(--panel); color: var(--tat-ink, var(--ink)); border-color: var(--tat-linie, var(--edge)); box-shadow: 0 2px 0 var(--tat-linie, var(--edge)); }
.stuetze-zeile { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.stuetze-zeile .spalte { min-width: 0; flex: 1 1 160px; }
.stuetze-zeile b { overflow-wrap: anywhere; }
.stuetze-zeile > p { flex-basis: 100%; margin: 0; }
.stuetze-knoepfe { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.icon-btn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn .ic { width: 18px; height: 18px; }
.link.warn { color: var(--gegner); }
.stuetze-form { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.stuetze-form input[type="number"] { max-width: 140px; }
/* „Rat für heute“ (Version 174): runder Knopf mit drei Punkten rechts neben dem Titel der Heldentat, die Liste darunter */
.rat { display: flex; flex-direction: column; gap: 8px; }
.rat-knopf { flex: none; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 1px solid var(--tat-linie); background: var(--tat-feld); color: var(--tat-leise); cursor: pointer; }
.rat-knopf:hover { border-color: var(--tat-akzent); }
.rat-knopf[aria-expanded="true"] { color: var(--tat-akzent); border-color: var(--tat-akzent); }
.rat-knopf .ic { width: 22px; height: 22px; stroke-width: 2.6; }
.rat-titel { color: var(--tat-ink); opacity: .75; } /* Überschrift im offenen Menü */
.rat-liste .nachtrag-zeile { align-items: stretch; }
.rat-liste .nachtrag-tage { display: flex; flex-wrap: wrap; gap: 6px; }
.rat-liste { align-self: stretch; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: var(--r); background: var(--tat-feld); border: 1px dashed var(--tat-rand); }
.rat-liste .probe { display: flex; flex-direction: column; gap: 6px; }
.rat-liste .link { justify-content: flex-start; width: 100%; min-height: 44px; padding: 6px 10px; border: 1px solid var(--tat-linie); border-radius: var(--r); background: var(--panel); color: var(--ink); text-align: left; text-decoration: none; }
.rat-liste .probe-box .link { width: auto; min-height: 40px; border: 0; background: none; text-decoration: underline; }
.ruhe-zeile { display: flex; flex-direction: column; gap: 2px; }
.ruhe-zeile .eyebrow { color: var(--tat-ink); opacity: .75; }
.ruhe-bilanz { margin: 2px 0 6px; color: var(--tat-ink); opacity: .75; } /* Version 140: Stufe und Beständigkeit nach dem Check */
.ruhe-text { margin: 0; font: 800 calc(19px * var(--text-skala, 1))/1.25 var(--fh); }
.buehne-reaktion { margin: 0; font: italic 500 calc(15px * var(--text-skala, 1))/1.4 var(--fi); color: var(--tat-leise); }
.buehne-reaktion.art-phase { color: var(--tat-wenn); }
.buehne-story { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r); background: var(--tat-feld); border: 1px solid var(--tat-linie); }
.buehne-story .spalte { flex: 1; min-width: 0; gap: 2px; }
.buehne-story .klein { color: var(--tat-leise); }
.buehne-story.frei { border-color: var(--tat-akzent); }
/* ---------- Lagerfeuer (Etappe 3, Teil C, 02.11.2026) ----------
   Ersetzt den Ruhezustand, sobald alle Taten beantwortet sind (ansicht/buehne.js lagerfeuerHtml). Eigene ruhige Fläche mit
   den Grundfarben des Stils (--panel, --ink, --soft), unabhängig von der Heldentat-Farbe darunter: gut lesbar in jedem Stil
   (Rückmeldung 02.11.: auf Rot schlecht lesbar). Glut als Zeichnung in den Stilfarben; Flackern und Funken laufen leise und
   stehen bei „Bewegung reduzieren“ still (Funken dann unsichtbar). */
.feuer-platz { display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 10px; border-radius: calc(var(--r) + 6px); background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--schatten); }
.feuer-platz.neu { animation: feuer-auftritt .7s ease-out both; }
/* Version 123: Abendszene. Der Himmel reicht bis an den Rand der Fläche, nur die Glut liegt darin (kein Text: auch der Titel
   steht darunter auf ruhigem Grund). Glutschein unten aus --feuer-glut, Schmuck (Sterne, Fenster, Holz …) aus --abend-deko.
   Keine neue Bewegung. */
.feuer-himmel { position: relative; margin: -12px -14px 0; padding: 14px 14px 6px; display: flex; flex-direction: column; align-items: center;
  border-radius: calc(var(--r) + 5px) calc(var(--r) + 5px) 0 0; border-bottom: 1px solid var(--line); color: var(--abend-ink);
  background: radial-gradient(ellipse 60% 80% at 50% 100%, color-mix(in srgb, var(--feuer-glut) 34%, transparent), transparent 72%), var(--abend-deko), var(--abend-grund); }
.feuer-himmel .feuer-szene { margin-bottom: 0; }
.feuer-himmel .feuer-holz { stroke: var(--abend-soft); }
.feuer-himmel .feuer-schein { fill: var(--feuer-glut); opacity: .28; }
@supports (color: color-mix(in srgb, red 50%, blue)) {
  .feuer-himmel .feuer-flamme.f1 { fill: color-mix(in srgb, var(--ac) 30%, var(--feuer-glut)); }
  .feuer-himmel .feuer-flamme.f2 { fill: var(--feuer-kern); }
}
.screen.kulisse .feuer-platz { box-shadow: var(--schatten), 0 0 0 1px var(--prunk-kante); }
.screen.kulisse .feuer-himmel { border-bottom: 2px solid var(--prunk-kante); }
@keyframes feuer-auftritt { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.feuer-szene { position: relative; height: 64px; display: grid; place-items: center; margin-bottom: -4px; }
.feuer-glut { width: 112px; height: 74px; overflow: visible; }
.feuer-schein { fill: var(--ac); opacity: .16; animation: bw-fackel 3.2s ease-in-out infinite; }
.feuer-flamme { transform-origin: 60px 64px; animation: feuer-flackern 2.4s ease-in-out infinite; }
.feuer-flamme.f1 { fill: var(--feuer-glut); }
.feuer-flamme.f2 { fill: var(--feuer-kern); animation-duration: 1.7s; animation-delay: -.6s; }
@supports (color: color-mix(in srgb, red 50%, blue)) {
  .feuer-flamme.f1 { fill: color-mix(in srgb, var(--ac) 70%, var(--feuer-glut)); }
  .feuer-flamme.f2 { fill: color-mix(in srgb, var(--ac) 20%, var(--feuer-kern)); }
}
.feuer-holz { fill: none; stroke: var(--soft); stroke-width: 5; opacity: .85; }
@keyframes feuer-flackern { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(.96, 1.06); } 55% { transform: scale(1.03, .95); } 80% { transform: scale(.98, 1.03); } }
.feuer-funken { position: absolute; inset: 0; pointer-events: none; }
.feuer-funken i { position: absolute; left: 50%; bottom: 18px; width: 3px; height: 3px; border-radius: 50%; background: var(--feuer-funke); opacity: 0; animation: feuer-funke 3.6s ease-out infinite; }
.feuer-funken i:nth-child(2) { --dx: -14px; animation-delay: .7s; } .feuer-funken i:nth-child(3) { --dx: 12px; animation-delay: 1.5s; }
.feuer-funken i:nth-child(4) { --dx: -6px; animation-delay: 2.2s; } .feuer-funken i:nth-child(5) { --dx: 18px; animation-delay: 2.9s; }
@keyframes feuer-funke { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(var(--dx, 6px), -58px); opacity: 0; } }
.feuer-titel { text-align: center; color: var(--soft); letter-spacing: .14em; }
.feuer-gruss { display: flex; gap: 12px; align-items: flex-start; }
.feuer-portraet { position: relative; flex: none; width: 52px; height: 52px; border-radius: 50%; overflow: hidden; border: 2px solid var(--ac); }
.feuer-portraet img { object-position: 50% 22%; }
.feuer-satz { margin: 0; min-width: 0; font: italic 500 calc(18px * var(--text-skala, 1))/1.4 var(--fi); color: var(--ink); }
.feuer-satz b { display: block; margin-bottom: 3px; font: 700 calc(11px * var(--text-skala, 1)) var(--fh); font-style: normal; letter-spacing: .12em; color: var(--ac); }
/* Siegelleiste (Etappe 3, Teil D, 02.11.2026): Tage der Runde als Siegel unter der Arena bzw. im Lagerfeuer beim Sprecher.
   Wachssiegel = Treffer (Stilfarbe), Blatt = keine Versuchung (Rand, ruhig), Mond = Ruhetag (still), offen = gestrichelt.
   Nie Rot, kein „verpasst“. Farben nur aus Stil-Tokens. */
.siegelleiste { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 2px 0 12px; }
.siegelleiste.feuer { margin: 4px 0 10px; }
.sl-tage { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.sl-tag { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; min-width: 36px; padding: 0; border: 0; background: none; color: inherit; font: inherit; }
button.sl-tag { cursor: pointer; border-radius: 8px; }
button.sl-tag:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.sl-tag small { font: 600 calc(11px * var(--text-skala, 1)) var(--fh); color: var(--soft); }
.sl-siegel { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; }
.sl-siegel .ic { width: 18px; height: 18px; }
.sl-siegel.wachs { background: var(--ac); color: var(--auf-ac); border: 2px solid var(--ac-dunkel); box-shadow: 0 2px 0 var(--ac-dunkel); }
.sl-siegel.blatt { background: var(--card); color: var(--gut); border: 2px solid var(--gut); }
.sl-siegel.mond { background: var(--tief); color: var(--soft); border: 2px solid var(--line); }
.sl-siegel.welle { background: var(--card); color: var(--soft); border: 2px solid var(--mute); } /* Version 141: War schwer */
.sl-siegel.offen { border: 2px dashed var(--line); background: transparent; }
.sl-siegel.heute { outline: 2px solid var(--ac); outline-offset: 2px; }
.sl-tag:has(.heute) small { color: var(--ac); }
.sl-satz { margin: 0; max-width: 36ch; text-align: center; font: italic 500 calc(15px * var(--text-skala, 1))/1.4 var(--fi); color: var(--ink); }
.siegelleiste.feuer .sl-satz { font-size: calc(14px * var(--text-skala, 1)); }
.feuer-platz .buehne-reaktion { text-align: center; color: var(--soft); }
.feuer-zeilen { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.feuer-zeile { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 8px 6px 10px; border-radius: var(--r); background: var(--tief); border: 1px solid var(--line); }
.feuer-siegel { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: var(--r-siegel-klein); }
.feuer-siegel .ic { width: 18px; height: 18px; }
.feuer-zeile.treffer .feuer-siegel { color: var(--auf-ac); background: var(--ac); box-shadow: inset 0 -3px 0 var(--ac-dunkel); }
.feuer-zeile.ruhe .feuer-siegel { color: var(--auf-gut); background: var(--gut); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.feuer-zeile.ruhetag .feuer-siegel { color: var(--soft); border: 1.5px dashed var(--soft); }
.feuer-zeile.schwer .feuer-siegel { color: var(--soft); background: var(--card); border: 1.5px solid var(--mute); } /* Version 141 */
.feuer-zeile-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.feuer-zeile-text b { font: 700 calc(15px * var(--text-skala, 1))/1.2 var(--fh); color: var(--ink); overflow-wrap: anywhere; }
.feuer-zeile-text span { font: 500 calc(15px * var(--text-skala, 1))/1.3 var(--fb); color: var(--ink); }
.feuer-zeile-text b + span { font-size: calc(14px * var(--text-skala, 1)); color: var(--soft); }
.lesen-knopf.leise.feuer-knopf { min-height: 40px; padding: 6px 12px; font-size: calc(13px * var(--text-skala, 1)); gap: 6px; background: var(--panel); color: var(--ink); border-color: var(--edge); box-shadow: 0 2px 0 var(--edge); }
.lesen-knopf.feuer-knopf .ic { width: 20px; height: 20px; }
.feuer-aendern { flex: none; min-height: 44px; padding: 0 6px; color: var(--ink); font: 600 calc(14px * var(--text-skala, 1)) var(--fb); }
.feuer-mehr { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.feuer-mehr-knopf { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font: 600 calc(15px * var(--text-skala, 1)) var(--fb); text-decoration: none; }
.feuer-mehr-knopf .ic { width: 16px; height: 16px; transition: transform .2s ease; }
.feuer-mehr-knopf[aria-expanded="true"] .ic { transform: rotate(180deg); }
.feuer-mehr-liste { align-self: stretch; display: flex; flex-direction: column; gap: 10px; }
.lesen-knopf { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: var(--r-cta); border: 1.5px solid var(--tat-akzent-dunkel); background: var(--tat-akzent); color: var(--tat-auf-akzent); box-shadow: 0 3px 0 var(--tat-akzent-dunkel); font: 800 calc(13px * var(--text-skala, 1)) var(--fh); letter-spacing: .06em; cursor: pointer; }
.lesen-knopf .ic { width: 24px; height: 24px; overflow: visible; }
.buch-blaettert .blatt { transform-origin: 12px 12px; animation: bw-blaettern 2.6s ease-in-out 3; }
@keyframes bw-blaettern { 0%, 35% { transform: scaleX(1); } 60%, 100% { transform: scaleX(-1); } }
.buehne .weiter-zu { align-self: stretch; }
/* Kompakter wie im Entwurf (31.10.2026): Heldentat in der Bühne ohne Porträt (der Held steht in der Kopfleiste),
   Wenn → Dann in einer Zeile, kleinere Medaille und Siegel, engere Abstände */
.buehne .buehne-tat.heldentat { gap: 10px; padding-top: 12px; padding-bottom: 14px; }
.buehne .tat-kopf { gap: 10px; }
.buehne .tat-medaille { width: 40px; height: 40px; }
.buehne .tat-medaille .ic { width: 22px; height: 22px; }
.buehne .tat-name { font-size: calc(20px * var(--text-skala, 1)); }
.tat-regel { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 8px 10px; border-radius: var(--r); background: var(--tat-feld); border: 1px solid var(--tat-linie); font: 500 calc(16px * var(--text-skala, 1))/1.35 var(--fb); }
.tat-regel b { font: 800 calc(10px * var(--text-skala, 1)) var(--fh); letter-spacing: .14em; color: var(--tat-wenn); }
.tat-regel b.dann { color: var(--tat-dann); }
.tat-regel .tat-pfeil { color: var(--tat-leise); }
.buehne .tat-frage { font-size: calc(16px * var(--text-skala, 1)); }
.buehne .siegel-rund { width: 64px; height: 64px; }
.buehne .siegel-rund::before { inset: 5px; }
.buehne .siegel-rund .ic { width: 28px; height: 28px; }
.buehne .tat-siegel { font-size: calc(13px * var(--text-skala, 1)); gap: 6px; }
.buehne .tat-siegel-reihe { gap: 10px; }
/* Version 95 (Etappe 1): Daumenleiste. Tagesfrage, Siegel und Hilfen bleiben unten im Blick, solange die Bühne sichtbar ist.
   Die Bühne braucht dafür overflow: clip statt hidden (hidden würde position: sticky abschalten). Siegel in der Leiste als
   flache Tasten (gleich groß, Abschnitt 18), damit der Wenn-Dann-Plan darüber sichtbar bleibt; Arena dafür etwas niedriger. */
.karte.buehne { overflow: clip; }
.screen.start .arena { --arena-hoch: 190px; }
.tat-daumen { position: sticky; bottom: 0; z-index: 8; display: flex; flex-direction: column; gap: 8px;
  margin: 2px calc(-1 * var(--rand-r, 16px)) -14px calc(-1 * var(--rand-l, 16px)); padding: 10px var(--rand-r, 16px) 10px var(--rand-l, 16px);
  background: var(--tat-bg); border-top: 1px solid var(--tat-linie, var(--line)); box-shadow: 0 -10px 18px -10px rgba(0,0,0,.45); }
.buehne-tat:has(.rat.offen) .tat-daumen, .tat-daumen.erster { position: static; box-shadow: none; } /* offenes Menü (Version 174) liegt nicht in der Leiste, sie soll es nicht verdecken */
.tat-daumen .tat-frage { font-size: calc(15px * var(--text-skala, 1)); line-height: 1.3; }
/* Version 174 (vorher Version 146: Plan als zwei Zeilen in der Leiste): Wenn-dann-Plan und Frage in EINEM Block, WENN und DANN je
   eine Zeile, darunter die Frage. Eine Karte, eine Entscheidung. */
.tat-block { display: flex; flex-direction: column; border-radius: var(--r); background: var(--tat-feld); border: 1px solid var(--tat-linie); overflow: hidden; }
.tat-regel.im-block { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 4px 10px; margin: 0; padding: 10px 12px 9px; border: 0; border-radius: 0; background: none; font: 500 calc(15px * var(--text-skala, 1))/1.35 var(--fb); }
.tat-block .tat-frage { margin: 0; padding: 9px 12px 10px; font-size: calc(16px * var(--text-skala, 1)); line-height: 1.3; }
.tat-regel.im-block + .tat-frage { border-top: 1px dashed var(--tat-linie); }
.tat-daumen .tat-siegel-reihe { gap: 8px; padding-top: 0; }
/* Zählweisen (04.11.2026): ohne Tagesfrage ein Siegel und ein ruhiger Satz darüber (kein Muss für heute) */
.tat-zw-hinweis { margin: 0 0 6px; text-align: center; color: var(--tat-leise); }
.tat-daumen .tat-siegel { flex-direction: row; justify-content: center; gap: 8px; min-height: 54px; max-width: none; padding: 6px 10px; border-radius: 14px; background: var(--tat-feld); border: 1px solid var(--tat-linie, var(--line)); font-size: calc(14px * var(--text-skala, 1)); }
.tat-daumen .siegel-rund { width: 40px; height: 40px; flex: none; }
.tat-daumen .siegel-rund::before { inset: 3px; }
.tat-daumen .siegel-rund .ic { width: 20px; height: 20px; }
.tat-daumen .tat-siegel:hover .siegel-rund { transform: none; }
.tat-daumen .tat-siegel:active { transform: translateY(1px); }
.tat-daumen .tat-siegel-reihe.drei .tat-siegel { flex-direction: column; gap: 4px; min-height: 72px; padding: 6px 4px; font-size: calc(13px * var(--text-skala, 1)); line-height: 1.15; }
.tat-daumen .tat-siegel-reihe.drei .siegel-rund { width: 34px; height: 34px; }
.tat-daumen .tat-siegel-reihe.drei .siegel-rund .ic { width: 18px; height: 18px; }
.daumen-hilfen { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 6px 14px; }
.daumen-hilfen .eintrag-link { min-height: 40px; color: var(--tat-leise); font-size: calc(14px * var(--text-skala, 1)); }
.tat-erster { margin: -4px 0 0; font: italic 500 calc(13px * var(--text-skala, 1))/1.35 var(--fi); color: var(--tat-leise); text-align: center; } /* in der Leiste: am ersten Tag sofort sichtbar */
/* Hinweis mit Rückgängig, über der Tableiste (liegt außerhalb von #app) */
.rueck-hinweis { position: fixed; z-index: 60; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 12px; overflow: hidden;
  background: var(--ink); color: var(--panel); box-shadow: 0 6px 18px rgba(0,0,0,.4); font: 600 calc(15px * var(--text-skala, 1))/1.3 var(--fb); animation: rueck-auf .22s ease-out; }
.rueck-hinweis > span { flex: 1; min-width: 0; }
.rueck-hinweis:not(.toast) > span:first-child::before { content: "✓ "; color: var(--gut); font-weight: 800; } /* 04.11.2026: Häkchen statt „Eingetragen:“ */
.rueck-hinweis button { min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--panel); font: 800 calc(14px * var(--text-skala, 1)) var(--fh); letter-spacing: .04em; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.rueck-hinweis button:focus-visible { outline: 3px solid var(--panel); outline-offset: 2px; }
.rueck-hinweis i { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--ac); transform-origin: left; animation: rueck-ablauf 3s linear forwards; } /* Dauer setzt die Ansicht (RUECKGAENGIG) */
@keyframes rueck-auf { from { opacity: 0; transform: translateY(8px); } }
@keyframes rueck-ablauf { to { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) { .rueck-hinweis, .rueck-hinweis i { animation: none; } }
/* Nur für Screenreader sichtbar */
.nur-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
/* Kopfleiste flacher (31.10.2026): Porträt 52 px, Titel kleiner, niedriger Pfad */
.karte.kopfleiste { padding: 10px 12px; gap: 6px; }
.kl-oben { gap: 10px; }
.kopfleiste .kopf-bild { width: 52px; height: 52px; border-width: 2px; }
.kl-stufe { font-size: calc(11px * var(--text-skala, 1)); padding: 3px 8px; }
.kopfleiste .questtitel { font-size: calc(16px * var(--text-skala, 1)); line-height: 1.2; }
/* Version 146 (Bewertung 05.11.2026, Punkt 10): das eigene Warum ist Motivation, keine Fußnote: größer, kräftiger, gerade */
.kopfleiste .quest-warum { font-size: calc(15px * var(--text-skala, 1)); font-style: normal; font-weight: 500; color: var(--ink); }
.kopfleiste .kl-bearbeiten { min-height: 32px; margin: -6px -4px -2px 0; padding: 3px 9px; }
.kopfleiste .weg { height: 60px; margin-top: 10px; }
.kopfleiste .station.aktuell { width: 36px; height: 36px; }
.kopfleiste .station.besiegt, .kopfleiste .station.verborgen { width: 26px; height: 26px; }
.kopfleiste .station.nebel { width: 26px; height: 26px; }
.kopfleiste .weg-held { width: 28px; height: 28px; }
.kopfleiste .leben { font-size: calc(14px * var(--text-skala, 1)); }
/* Version 89: Lebenszeile neben dem Porträt (unter Titel/Warum), bricht bei Platzmangel sauber um */
.kopfleiste .kopf-text .leben { align-items: flex-start; gap: 6px; margin-top: 4px; font-size: calc(14px * var(--text-skala, 1)); line-height: 1.3; }
.kopfleiste .kopf-text .leben .ic { width: 16px; height: 16px; margin-top: 1px; flex: none; }
.kopfleiste .kopf-text .leben span { min-width: 0; overflow-wrap: anywhere; }
/* Etappe 3, Teil A: Warum und Zahl in einer Zeile, Weg etwas flacher */
.kl-zeile { display: flex; align-items: flex-start; gap: 8px; margin: 2px 0 0; min-width: 0; }
/* Version 146: zwei Zeilen statt einer (eine Zeile zeigte am Handy nur rund 20 Zeichen); länger → Knopf zum Aufklappen */
.kl-zeile .quest-warum { flex: 1; min-width: 0; margin: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.kl-zeile.auf .quest-warum { display: block; }
.kl-zeile.auf .quest-warum { white-space: normal; overflow-wrap: anywhere; }
.kl-zahl { flex: none; display: inline-flex; align-items: center; gap: 3px; font: 600 calc(14px * var(--text-skala, 1))/1.35 var(--fb, inherit); color: var(--ink); }
.kl-zahl .ic { width: 15px; height: 15px; color: var(--gut); stroke-width: 3; }
.kl-warum-knopf { flex: none; width: 32px; height: 32px; margin: -6px -6px -6px -4px; color: var(--soft); }
.kl-warum-knopf .ic { width: 18px; height: 18px; }
.kopfleiste .weg { height: 50px; margin-top: 6px; }
/* Tab „Bald“ und Blatt „Was noch kommt“ */
.bald-liste { list-style: none; margin: 4px 0 8px; padding: 0; display: flex; flex-direction: column; gap: 12px; text-align: left; }
.bald-zeile { display: flex; align-items: flex-start; gap: 12px; }
.bald-ic { flex: none; width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--line); color: var(--soft); }
.bald-ic .ic { width: 20px; height: 20px; }
.bald-zeile.verdient .bald-ic { background: var(--ac); color: var(--auf-ac); }
.bald-zeile b { color: var(--ink); }
/* Etappe 3, Teil B: Tagesleiste „Heute x von n“ */
.tagesleiste { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; }
.tl-text { display: flex; flex-direction: column; line-height: 1.15; }
.tl-text b { font: 700 calc(17px * var(--text-skala, 1)) var(--fh); color: var(--ink); font-variant-numeric: tabular-nums; }
.tl-helden { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
.tl-held { position: relative; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; }
.tl-held .tl-bild { width: 40px; height: 40px; margin: 2px; border-radius: 50%; object-fit: cover; display: block; }
.tl-held.an .tl-bild { outline: 3px solid var(--ac); outline-offset: 1px; }
.tl-held:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
.tl-haken { position: absolute; right: -3px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--gut); color: #fff; border: 2px solid var(--panel); }
.tl-haken .ic { width: 11px; height: 11px; stroke-width: 3.5; }
.tl-offen { position: absolute; right: 0; top: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--ac); border: 2px solid var(--panel); } /* Punkt 1b: offen, Akzentfarbe des Stils */
/* Version 177: Helden ohne Tagesfrage (Rhythmus, Wache): Trennstrich, ruhiger Ring statt Punkt, Zählweise als Beschriftung */
.tl-trenner { align-self: stretch; width: 1px; background: var(--line); margin: 2px 0; }
.tl-abruf-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tl-held.abruf .tl-bild { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--mute); }
.tl-held.abruf.an .tl-bild { box-shadow: none; }
.tl-kappe { font-size: calc(10px * var(--text-skala, 1)); line-height: 1.1; color: var(--mute); }
.weiter-daumen { flex-direction: row; align-items: center; gap: 10px; }
.weiter-daumen .weiter-zu { flex: 1; min-width: 0; margin: 0; }
.weiter-spaeter { flex: none; min-height: 44px; padding: 0 6px; color: var(--tat-leise, var(--soft)); }
.weiter-daumen:has(.rueck-zeile) { flex-wrap: wrap; } /* 04.11.2026: Rückgängig als Zeile in der Leiste statt Popup darüber */
.rueck-zeile { position: relative; flex: 1 1 100%; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 4px 0 12px; border-radius: 12px; overflow: hidden;
  background: var(--tat-feld, var(--panel)); border: 1px solid var(--tat-linie, var(--line)); color: var(--tat-ink, var(--ink)); font: 600 calc(15px * var(--text-skala, 1))/1.3 var(--fb); animation: rueck-auf .22s ease-out; }
.rueck-zeile .rueck-wort { flex: 1; min-width: 0; display: inline-flex; align-items: center; gap: 8px; }
.rueck-zeile .rueck-wort .ic { width: 18px; height: 18px; flex: none; color: var(--gut); stroke-width: 3; }
.rueck-zeile .link { min-height: 44px; padding: 0 10px; color: var(--tat-ink, var(--ink)); font-weight: 800; }
.rueck-zeile i { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--tat-akzent, var(--ac)); transform-origin: left; animation-name: rueck-ablauf; animation-timing-function: linear; animation-fill-mode: forwards; }
body:has(.rueck-zeile) #rueck-hinweis { display: none; } /* steht die Zeile in der Leiste, kein zweiter Hinweis darüber */
@media (prefers-reduced-motion: reduce) { .rueck-zeile, .rueck-zeile i { animation: none; } }
.toast { padding: 12px 14px; cursor: pointer; } /* kurze Bestätigungen (Etappe 3), Aussehen wie der Rückgängig-Hinweis */
/* Etappe 3 (Punkt 14–16a): Arena-Text lesbar auf jedem Bild – dunkler Verlauf unten, Text größer und voll deckend */
/* Namensschild (Version 160/161): Tafel um Name und Kraftsegmente. Alle Werte stehen als Tokens --schild-* im Grundblock (Fantasy) und
   in jedem Stilblock; hier keine Rückfallwerte nötig. Beiname und Kraftzeile entfallen, wo der Stil es will (--schild-unter, --schild-kraft);
   „Extra“, „ab morgen“ und der Siegtag-Satz bleiben sichtbar. Helle Tafeln (Rom) brauchen eigene Schriftfarbe und Leersegmente (--schild-ink, --schild-seg-*). */
.arena-text { padding: var(--schild-pad); gap: var(--schild-gap); border: var(--schild-rand); border-radius: var(--schild-radius); background: var(--schild-bg); box-shadow: var(--schild-schatten); text-shadow: var(--schild-text-schatten); }
.arena-text::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: var(--schild-nieten); background-repeat: no-repeat; background-position: var(--schild-nieten-lage); background-size: var(--schild-nieten-groesse); }
.arena-text .gegner-name { color: var(--schild-ink); text-shadow: var(--schild-text-schatten); font-size: calc(var(--schild-name-gr) * var(--text-skala, 1)); letter-spacing: var(--schild-name-abstand); text-transform: var(--schild-name-versal); }
.arena-text :is(.besiegt-text, .kraft-zeile) { color: var(--schild-ink); }
.gegner-zeile small:not(.besiegt-text) { display: var(--schild-unter); }
.kraft-zeile.schlicht { display: var(--schild-kraft); }
.buehne.mit-held .arena-text { padding: var(--schild-pad-held); }
.gegner-zeile small { font-size: calc(14px * var(--text-skala, 1)); opacity: 1; }
.kraft-zeile { font-size: calc(14px * var(--text-skala, 1)); opacity: 1; }
.arena .segmente i { height: var(--schild-seg-hoch); border-radius: var(--schild-seg-radius); background: var(--schild-seg-leer); border-color: var(--schild-seg-rand); }
/* Weg als Kette (KOPFLEISTE.weg = 'kette'): Mini-Bilder in einer Zeile */
.weg-kette { display: flex; align-items: center; gap: 0; margin-top: 4px; }
.kette-st, .kette-held { position: relative; flex: none; width: 26px; height: 26px; border-radius: 50%; overflow: hidden; border: 2px solid var(--edge); background: var(--nacht); box-sizing: border-box; }
.kette-st img, .kette-held img { width: 100%; height: 100%; object-fit: cover; }
.kette-st.aktuell { width: 32px; height: 32px; border-color: var(--gegner); }
.kette-st.besiegt { opacity: .8; }
.kette-st.besiegt .station-haken .ic { width: 14px; height: 14px; }
.kette-held { width: 30px; height: 30px; border-color: var(--gut); background: var(--panel); }
.kette-st.nebel { border: 2px dashed var(--line); background: radial-gradient(circle, var(--tief) 30%, transparent 75%); }
.kette-linie { flex: 0 1 18px; min-width: 6px; height: 2px; background: var(--line); }


/* ---------- Geschichte im Buch-Look (Etappe 3, Teil F, 02.11.2026) ----------
   Gleiche Sprache wie die Chronik: Stil-Kulisse, Kopf als Zierseite, jeder Teil eine Buchseite (.karte) mit Siegel am Rand.
   Wachssiegel (Akzentfarbe) = gelesen (mit Riss) oder bereit; gestrichelter Kreis = wartet; Nebelstreifen statt Rahmen
   für alles Spätere. Nur unter .st-buch, damit die Karte (.rs-runde) ihre flachen Teile behält. Nie Rot als Mahnung. */
.st-zier { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 4px 8px 16px; border-bottom: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); }
.st-zier h1 { margin: 2px 0 0; }
.st-zier .klein { margin: 4px 0 0; max-width: 36ch; }
.st-zier-siegel { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 4px; background: var(--ac); color: var(--auf-ac); border: 2px solid var(--ac-dunkel); box-shadow: 0 2px 0 var(--ac-dunkel); }
.st-zier-siegel .ic { width: 24px; height: 24px; }
.st-buch { gap: 14px; }
.st-buch .st-seite { position: relative; padding: 14px 16px; gap: 6px; }
.st-buch .teil.versiegelt { border: var(--k-rand, 2px solid var(--edge)); border-radius: 8px; }
.st-titel { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.st-titel .eyebrow { line-height: 1.2; }
/* Siegel */
.st-siegel { position: relative; flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; box-sizing: border-box; }
.st-siegel .ic { width: 20px; height: 20px; }
.st-siegel.wachs { background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--ac) 70%, #fff), var(--ac) 55%, var(--ac-dunkel)); color: var(--auf-ac); border: 2px solid var(--ac-dunkel); box-shadow: 0 2px 0 var(--ac-dunkel); }
.st-siegel.gebrochen::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: linear-gradient(128deg, transparent 47%, var(--ac-dunkel) 47% 53%, transparent 53%); opacity: .8; }
.st-siegel.offen { border: 2px dashed var(--line); color: var(--mute); background: transparent; }
.st-siegel.gross { width: 64px; height: 64px; }
.st-siegel.gross .ic { width: 30px; height: 30px; }
/* gelesen: Siegel + Titel in einer Zeile, Text wie eine Buchseite mit Initiale */
.st-buch .teil.gelesen summary { flex-direction: row; align-items: center; gap: 12px; }
.st-buch .teil.gelesen summary h3 { font-size: calc(18px * var(--text-skala, 1)); }
.st-buch .teil.gelesen p { margin-top: 10px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); font-size: calc(18px * var(--text-skala, 1)); line-height: 1.6; }
.st-initiale::first-letter { float: left; font: 700 2.6em/.9 var(--fh); margin: 4px 4px 0 0; color: var(--ac); }
/* bereit zum Brechen: Brief mit großem Wachssiegel, mittig */
.st-buch .teil.frei-siegel { align-items: center; text-align: center; padding: 18px 16px; gap: 8px; box-shadow: var(--k-schatten, 0 3px 0 var(--edge)), 0 0 0 3px color-mix(in srgb, var(--ac) 28%, transparent); }
.st-buch .teil.frei-siegel .andeutung { max-width: 32ch; }
.st-buch .teil.frei-siegel .siegel-knopf { align-self: center; }
/* wartet / bereit (nach Pausen): leiser, Siegel am Rand */
.st-buch .st-wartet { flex-direction: row; align-items: flex-start; gap: 12px; }
.st-buch .st-wartet .andeutung { font-size: calc(16px * var(--text-skala, 1)) !important; }
.st-buch .st-wartet .klein { margin: 0; }
/* Nebel: Streifen ziehen langsam über die Kulisse, kein Rahmen */
.st-buch .st-nebel { min-height: 96px; border-radius: 12px; }
.st-nebel .nebel-schleier { display: none; }
.st-nebel-streifen { position: absolute; inset: 0; pointer-events: none; }
.st-nebel-streifen i { position: absolute; left: -25%; right: -25%; height: 24px; border-radius: 999px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 30%, transparent) 30%, color-mix(in srgb, var(--ink) 30%, transparent) 70%, transparent); filter: blur(7px); animation: st-nebel 16s ease-in-out infinite alternate; }
.st-nebel-streifen i:nth-child(1) { top: 10%; }
.st-nebel-streifen i:nth-child(2) { top: 40%; opacity: .7; animation-duration: 21s; animation-direction: alternate-reverse; }
.st-nebel-streifen i:nth-child(3) { top: 68%; opacity: .5; animation-duration: 26s; }
/* Einblendung nach dem Tages-Check (feier.js) als dieselbe Buchseite: Rahmen des Stils, Siegel bricht über dem Bild */
.st-moment { border: var(--k-rand, 2px solid var(--edge)); box-shadow: var(--k-schatten, 0 3px 0 var(--edge)), 0 12px 40px rgba(0,0,0,.4); background-image: var(--k-ecken, none); background-position: var(--k-ecken-lage, 0 0); background-size: var(--k-ecken-groesse, auto); background-repeat: no-repeat; background-origin: border-box; }
.st-moment .story-bild { height: 150px; }
.st-moment-siegel { align-self: center; margin-top: -46px; z-index: 1; animation: st-stempel .55s .15s cubic-bezier(.2,1.5,.4,1) both; }
.st-moment-siegel::after { animation: st-riss .35s .75s ease-out both; }
.st-moment .story-text { margin-top: 0; }
.st-moment .story-absatz { padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); }
.st-folgt { position: relative; overflow: hidden; padding: 8px 0; text-align: center; }
.st-folgt > span:last-child { position: relative; }
@keyframes st-stempel { from { transform: scale(1.8) rotate(-20deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes st-riss { from { opacity: 0; transform: scale(.4); } to { opacity: .8; transform: none; } }
@keyframes st-nebel { from { transform: translateX(-10%); } to { transform: translateX(10%); } }


/* ---------- Bewegung (Version 68, „Bewegung vereinheitlichen“) ----------
   Katalog: jede Bewegung EINMAL (Dauer, Kurve und Takt in daten/bewegung.js, Werte inline über logik/bewegung.js).
   „Bewegung reduzieren“: app.js setzt data-bewegung="aus" genau dann, wenn das Betriebssystem es verlangt; die Medienabfrage
   greift schon vor dem Start. EINE Regel schaltet alles ab – neue Animationen brauchen keinen eigenen Eintrag.
   Was ohne Animation anders aussehen muss (sonst unsichtbar oder halb gezeichnet), steht darunter als Endzustand. */
@keyframes bw-treffer { 0%, 100% { transform: none; } 20% { transform: translateX(-6px) rotate(-1.5deg); } 40% { transform: translateX(5px) rotate(1deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
@keyframes bw-blitz { 0% { opacity: 0; } 12% { opacity: .5; } 30% { opacity: .1; } 42% { opacity: .3; } 100% { opacity: 0; } }
/* bw-erloeschen nur mit filter: im selben Ablauf läuft oft bw-treffer (transform), die spätere Animation würde sie sonst überdecken */
@keyframes bw-erloeschen { from { filter: none; } to { filter: grayscale(.7) brightness(.8); } }
@keyframes bw-stempel { 0% { opacity: 0; transform: scale(1.8) rotate(-8deg); } 70% { opacity: 1; transform: scale(.94) rotate(1deg); } 100% { opacity: 1; transform: none; } }
@keyframes bw-funkeln { 0% { transform: scale(.4) rotate(-40deg); opacity: 0; } 60% { transform: scale(1.35) rotate(10deg); opacity: 1; } 100% { transform: none; opacity: 1; } }
.bw-blitz-ebene { position: absolute; inset: 0; background: var(--gegner); opacity: 0; pointer-events: none; }
:root[data-bewegung="aus"] *, :root[data-bewegung="aus"] *::before, :root[data-bewegung="aus"] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* Endzustände ohne Bewegung */
:root[data-bewegung="aus"] .satz, :root[data-bewegung="aus"] .wechsel-banner { opacity: 1; transform: none; }
:root[data-bewegung="aus"] .erledigt.neu .ic path { stroke-dashoffset: 0; }
:root[data-bewegung="aus"] .heldentat .btn:active { transform: none; }
:root[data-bewegung="aus"] .xpflug { display: none; }
:root[data-bewegung="aus"] .lauf-held { left: 62%; }
:root[data-bewegung="aus"] .arena-funken { display: none; }
@media (prefers-reduced-motion: reduce) {
